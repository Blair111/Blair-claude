<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoSocial SAFE RESET</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial;
}

#container{
display:flex;
height:100vh;
}

#sidebar{
width:320px;
background:#111827;
color:white;
padding:10px;
overflow:auto;
}

#map{
flex:1;
}

.card{
background:#1f2937;
padding:10px;
margin-bottom:10px;
border-radius:10px;
}

button{
padding:6px 10px;
border:none;
background:#2563eb;
color:white;
border-radius:6px;
cursor:pointer;
margin-top:6px;
}

.item{
background:#374151;
padding:6px;
margin-top:6px;
border-radius:6px;
}
</style>
</head>

<body>

<div id="container">
<div id="sidebar"></div>
<div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ================= MAP ================= */

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

/* ================= DATA ================= */

let places = JSON.parse(localStorage.getItem("places") || "[]");
let geofences = JSON.parse(localStorage.getItem("geofences") || "[]");

/* ================= LAYERS ================= */

let placeMarkers = [];
let fenceLayers = [];

/* ================= SAVE ================= */

function save(){
localStorage.setItem("places", JSON.stringify(places));
localStorage.setItem("geofences", JSON.stringify(geofences));
}

/* ================= DRAW PLACES ================= */

function drawPlaces(){

placeMarkers.forEach(m => map.removeLayer(m));
placeMarkers = [];

for(let i=0;i<places.length;i++){
let p = places[i];

let m = L.marker([p.lat,p.lng]).addTo(map);
m.bindPopup(p.name);

placeMarkers.push(m);
}
}

/* ================= DRAW GEOFENCES ================= */

function drawGeofences(){

fenceLayers.forEach(f => map.removeLayer(f));
fenceLayers = [];

for(let i=0;i<geofences.length;i++){
let g = geofences[i];

let c = L.circle([g.lat,g.lng],{
radius:g.radius,
color:"orange",
fillOpacity:0.2
}).addTo(map);

c.bindPopup(g.name);

fenceLayers.push(c);
}
}

/* ================= SIDEBAR ================= */

function render(){

let el = document.getElementById("sidebar");

let html = "";

html += "<div class='card'><b>PLACES</b>";

for(let i=0;i<places.length;i++){
html += "<div class='item'>" + places[i].name + "</div>";
}

html += "</div>";

html += "<div class='card'><b>GEOFENCES</b>";

for(let i=0;i<geofences.length;i++){
html += "<div class='item'>" + geofences[i].name + "</div>";
}

html += "</div>";

el.innerHTML = html;
}

/* ================= MAP CLICK ================= */

map.on("click", function(e){

let type = prompt("place or geofence");
if(!type) return;

if(type === "place"){

let name = prompt("name");

places.push({
id:Date.now(),
name:name,
lat:e.latlng.lat,
lng:e.latlng.lng
});

save();
drawPlaces();
render();
return;
}

let name = prompt("geofence name");
let radius = prompt("radius",200);

geofences.push({
id:Date.now(),
name:name,
lat:e.latlng.lat,
lng:e.latlng.lng,
radius:parseInt(radius)
});

save();
drawGeofences();
render();

});

/* ================= INIT ================= */

drawPlaces();
drawGeofences();
render();

</script>

</body>
</html>
