<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Map</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial,sans-serif;
}

#topbar{
background:#111827;
color:white;
padding:10px;
display:flex;
gap:15px;
align-items:center;
flex-wrap:wrap;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
}

#map{
height:calc(100vh - 50px);
width:100%;
}

#info{
font-weight:bold;
}

#coords{
color:#93c5fd;
}
</style>
</head>

<body>

<div id="topbar">
<button onclick="trackMe()">Track Me</button>
<span id="info">Ready</span>
<span id="coords">Lat: -- | Lng: --</span>
</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

let places = JSON.parse(localStorage.getItem('places') || '[]');
let markers = [];
let selected = [];
let routeLayer = null;
let userMarker = null;
let accuracyCircle = null;

function savePlaces(){
localStorage.setItem('places', JSON.stringify(places));
}

async function getAddress(lat,lng){

try{

const response = await fetch(
`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`
);

if(!response.ok){
throw new Error("Lookup failed");
}

const data = await response.json();

return data.display_name || "Address not found";

}
catch(err){

console.error(err);

return "Address lookup failed";

}

}

function renderPlaces(){

markers.forEach(marker => map.removeLayer(marker));
markers = [];

places.forEach(place => {

const marker = L.marker([place.lat, place.lng])
.addTo(map)
.bindPopup(`
<b>${place.name}</b>
<br><br>

<b>Latitude:</b><br>
${place.lat.toFixed(6)}

<br><br>

<b>Longitude:</b><br>
${place.lng.toFixed(6)}

<br><br>

<b>Address:</b><br>
${place.address}
`);

marker.on('click', () => {

selected.push(place);

if(selected.length === 2){

createRoute(
selected[0],
selected[1]
);

selected = [];

}

});

markers.push(marker);

});

}

async function createRoute(a,b){

try{

const url =
`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;

const response = await fetch(url);
const data = await response.json();

if(!data.routes || !data.routes.length){
document.getElementById("info").innerText = "No route found";
return;
}

if(routeLayer){
map.removeLayer(routeLayer);
}

routeLayer = L.geoJSON(
data.routes[0].geometry,
{
style:{
color:"blue",
weight:5
}
}
).addTo(map);

map.fitBounds(routeLayer.getBounds());

const km =
(data.routes[0].distance / 1000).toFixed(2);

const mins =
(data.routes[0].duration / 60).toFixed(1);

document.getElementById("info").innerText =
`${a.name} → ${b.name} | ${km} km | ${mins} mins`;

}
catch(err){

console.error(err);

document.getElementById("info").innerText =
"Routing error";

}

}

function trackMe(){

if(!navigator.geolocation){
alert("Geolocation not supported");
return;
}

navigator.geolocation.watchPosition(

(position)=>{

const lat = position.coords.latitude;
const lng = position.coords.longitude;
const accuracy = position.coords.accuracy;

if(!userMarker){

const userIcon = L.divIcon({
html: `
<div style="
width:20px;
height:20px;
background:#2563eb;
border:3px solid white;
border-radius:50%;
box-shadow:0 0 12px rgba(37,99,235,0.9);
"></div>
`,
className:"",
iconSize:[20,20]
});

userMarker = L.marker(
[lat,lng],
{
icon:userIcon
}
).addTo(map)
.bindPopup("You are here");

}
userMarker.setLatLng([lat,lng]);
if(accuracyCircle){
map.removeLayer(accuracyCircle);
}

accuracyCircle = L.circle(
[lat,lng],
{
radius: accuracy,
color:"#2563eb",
fillColor:"#2563eb",
fillOpacity:0.15,
weight:1
}
).addTo(map);

map.setView([lat,lng],15);

document.getElementById("info").innerText =
"Tracking active";

},

(error)=>{

document.getElementById("info").innerText =
"Location unavailable";

}

);

}

map.on('mousemove',(e)=>{

document.getElementById("coords").innerText =
`Lat: ${e.latlng.lat.toFixed(6)} | Lng: ${e.latlng.lng.toFixed(6)}`;

});

map.on('click', async (e)=>{

const name = prompt("Location name");

if(!name) return;

document.getElementById("info").innerText =
"Finding address...";

const address =
await getAddress(
e.latlng.lat,
e.latlng.lng
);

places.push({
name:name,
lat:e.latlng.lat,
lng:e.latlng.lng,
address:address
});

savePlaces();
renderPlaces();

document.getElementById("info").innerText =
"Saved";

});

renderPlaces();

</script>

</body>
</html>
