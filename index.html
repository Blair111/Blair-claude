<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Full Map Engine</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
height: 100%;
margin: 0;
font-family: Arial;
background: #0f172a;
color: white;
}

#topbar {
background: #111827;
padding: 10px;
display: flex;
gap: 10px;
align-items: center;
flex-wrap: wrap;
}

button {
padding: 10px;
border: none;
border-radius: 8px;
background: #2563eb;
color: white;
cursor: pointer;
}

#map {
height: calc(100vh - 60px);
width: 100%;
}

#info {
margin-left: 10px;
}
</style>
</head>

<body>

<div id="topbar">
<button onclick="startTracking()">Track Me</button>
<span>Click map to add places • Click 2 markers to route</span>
<span id="info">Ready</span>
</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([55.9533, -3.1883], 13);

// Base map
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution: '© OpenStreetMap'
}).addTo(map);

// =======================
// DATA STORAGE
// =======================
let savedPlaces = JSON.parse(localStorage.getItem("savedPlaces") || "[]");
let markers = [];
let routeLayer = null;

// routing selection
let routeSelection = [];

// user location marker
let userMarker = null;

// =======================
// SAVE PLACES
// =======================
function savePlaces() {
localStorage.setItem("savedPlaces", JSON.stringify(savedPlaces));
}

// =======================
// RENDER SAVED PLACES
// =======================
function renderPlaces() {

markers.forEach(m => map.removeLayer(m));
markers = [];

savedPlaces.forEach(place => {

const marker = L.marker([place.lat, place.lng])
.addTo(map)
.bindPopup(place.name);

marker.on("click", () => {

routeSelection.push(place);

if (routeSelection.length === 2) {
getRoute(routeSelection[0], routeSelection[1]);
routeSelection = [];
}
});

markers.push(marker);
});

}

// =======================
// LIVE LOCATION TRACKING
// =======================
function startTracking() {

if (!navigator.geolocation) {
alert("Geolocation not supported");
return;
}

navigator.geolocation.watchPosition(pos => {

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

if (!userMarker) {
userMarker = L.circleMarker([lat, lng], {
radius: 10,
color: "#22c55e",
fillColor: "#22c55e",
fillOpacity: 1
}).addTo(map).bindPopup("You are here");
}

userMarker.setLatLng([lat, lng]);
map.setView([lat, lng], 15);

document.getElementById("info").innerText = "Live tracking active";

});

}

// =======================
// ADD PLACE BY CLICK
// =======================
map.on("click", function(e) {

const name = prompt("Name this place");
if (!name) return;

savedPlaces.push({
name,
lat: e.latlng.lat,
lng: e.latlng.lng
});

savePlaces();
renderPlaces();

});

// =======================
// REAL ROAD ROUTING (OSRM)
// =======================
async function getRoute(a, b) {

const url =
`https://router.project-osrm.org/route/v1/driving/` +
`${a.lng},${a.lat};${b.lng},${b.lat}` +
`?overview=full&geometries=geojson`;

try {

const res = await fetch(url);
const data = await res.json();

const route = data.routes[0];

if (!route) {
document.getElementById("info").innerText = "No route found";
return;
}

// remove old route
if (routeLayer) map.removeLayer(routeLayer);

// draw BLUE route
routeLayer = L.geoJSON(route.geometry, {
style: {
color: "blue",
weight: 5
}
}).addTo(map);

map.fitBounds(routeLayer.getBounds());

const km = route.distance / 1000;
const min = route.duration / 60;

document.getElementById("info").innerText =
`${a.name} → ${b.name} | ${km.toFixed(2)} km | ${min.toFixed(1)} min`;

} catch (err) {
console.error(err);
document.getElementById("info").innerText = "Routing error";
}

}

// =======================
// INIT
// =======================
renderPlaces();

</script>

</body>
</html>
