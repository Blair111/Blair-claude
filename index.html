<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoPlatform V3 Stable</title>

<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial,sans-serif;
background:#0f172a;
overflow:hidden;
}

#topbar{
height:55px;
background:#111827;
color:white;
display:flex;
align-items:center;
padding:0 15px;
gap:10px;
border-bottom:1px solid #1f2937;
}

button{
background:#2563eb;
color:white;
border:none;
border-radius:8px;
padding:8px 12px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#container{
display:flex;
height:calc(100vh - 55px);
}

#sidebar{
width:340px;
background:#111827;
color:white;
overflow-y:auto;
padding:12px;
border-right:1px solid #1f2937;
}

#map{
flex:1;
}

.card{
background:#1f2937;
padding:12px;
border-radius:10px;
margin-bottom:12px;
}

.section-title{
font-size:12px;
opacity:0.7;
margin-bottom:8px;
}

.item{
background:#374151;
padding:8px;
border-radius:8px;
margin-bottom:8px;
}

.small{
font-size:12px;
opacity:0.7;
}

.action-row{
display:flex;
gap:6px;
margin-top:6px;
flex-wrap:wrap;
}

</style>
</head>

<body>

<div id="topbar">
<button id="trackBtn">Start Tracking</button>
<span>GeoPlatform V3</span>
</div>

<div id="container">
<div id="sidebar"></div>
<div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ===================== MAP ===================== */

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

/* ===================== DATA ===================== */

let places = JSON.parse(localStorage.getItem("places") || "[]");
let geofences = JSON.parse(localStorage.getItem("geofences") || "[]");
let archived = JSON.parse(localStorage.getItem("archived") || "[]");
let inside = JSON.parse(localStorage.getItem("inside") || "{}");

/* ROUTE STATE */
let routeStart = null;
let routeEnd = null;
let routeLayer = null;
let routeDistance = null;
let routeDuration = null;

/* MAP LAYERS */
let placeMarkers = [];
let fenceLayers = [];
let userMarker = null;
let accuracyCircle = null;

/* ===================== SAVE ===================== */

function save(){
localStorage.setItem("places", JSON.stringify(places));
localStorage.setItem("geofences", JSON.stringify(geofences));
localStorage.setItem("archived", JSON.stringify(archived));
localStorage.setItem("inside", JSON.stringify(inside));
}

/* ===================== DISTANCE ===================== */

function dist(a,b,c,d){
const R=6371000;
const dLat=(c-a)*Math.PI/180;
const dLng=(d-b)*Math.PI/180;

const x=
Math.sin(dLat/2)**2 +
Math.cos(a*Math.PI/180)*
Math.cos(c*Math.PI/180)*
Math.sin(dLng/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/* ===================== REVERSE GEO ===================== */

async function getAddress(lat,lng){
try{
const r = await fetch(
`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`
);
const d = await r.json();
return d.display_name || "Unknown";
}catch{
return "Unknown";
}
}

/* ===================== DRAW ===================== */

function drawPlaces(){

placeMarkers.forEach(m=>map.removeLayer(m));
placeMarkers=[];

places.forEach(p=>{
const m = L.marker([p.lat,p.lng]).addTo(map);
m.bindPopup(p.name);
placeMarkers.push(m);
});
}

function drawGeofences(){

fenceLayers.forEach(f=>map.removeLayer(f));
fenceLayers=[];

geofences.forEach(g=>{
const c = L.circle([g.lat,g.lng],{
radius:g.radius,
color:"orange",
fillOpacity:0.2
}).addTo(map);

c.bindPopup(g.name);
fenceLayers.push(c);
});
}

/* ===================== ROUTING ===================== */

async function route(){

if(!routeStart || !routeEnd) return;

const url =
`https://router.project-osrm.org/route/v1/driving/${routeStart.lng},${routeStart.lat};${routeEnd.lng},${routeEnd.lat}?overview=full&geometries=geojson`;

const res = await fetch(url);
const data = await res.json();

if(routeLayer) map.removeLayer(routeLayer);

routeLayer = L.geoJSON(data.routes[0].geometry,{
color:"blue",
weight:5
}).addTo(map);

map.fitBounds(routeLayer.getBounds());

routeDistance = (data.routes[0].distance/1000).toFixed(1);
routeDuration = (data.routes[0].duration/60).toFixed(0);

render();
}

function selectRoute(id){

const p = places.find(x=>x.id===id);
if(!p) return;

if(!routeStart){
routeStart = p;
render();
return;
}

if(!routeEnd){
routeEnd = p;
route();
return;
}

routeStart = p;
routeEnd = null;
routeDistance = null;
routeDuration = null;

if(routeLayer){
map.removeLayer(routeLayer);
routeLayer=null;
}

render();
}

function clearRoute(){
routeStart=null;
routeEnd=null;
routeDistance=null;
routeDuration=null;

if(routeLayer){
map.removeLayer(routeLayer);
routeLayer=null;
}

render();
}

/* ===================== SIDEBAR ===================== */

function render(){

const s = document.getElementById("sidebar");

let html = "";

/* STATS */
html += `
<div class="card">
<div class="section-title">STATS</div>
<div>Places: ${places.length}</div>
<div>Geofences: ${geofences.length}</div>
<div>Archived: ${archived.length}</div>
</div>
`;

/* ROUTE */
html += `
<div class="card">
<div class="section-title">ROUTE</div>
<div>Start: ${routeStart?routeStart.name:"None"}</div>
<div>End: ${routeEnd?routeEnd.name:"None"}</div>
<div>${routeDistance?("Distance: "+routeDistance+" km"):""}</div>
<div>${routeDuration?("Time: "+routeDuration+" min"):""}</div>
<br>
<button onclick="clearRoute()">Clear</button>
</div>
`;

/* PLACES */
html += `
<div class="card">
<div class="section-title">PLACES</div>
`;

places.forEach(p=>{
html += `
<div class="item">
<b>${p.name}</b>
<div class="small">${p.address||""}</div>

<div class="action-row">
<button onclick="map.setView([${p.lat},${p.lng}],15)">Zoom</button>
<button onclick="selectRoute(${p.id})">Select</button>
</div>
</div>
`;
});

html += `</div>`;

/* GEOFENCES */
html += `
<div class="card">
<div class="section-title">GEOFENCES</div>
`;

geofences.forEach(g=>{
html += `
<div class="item">
<b>${g.name}</b>
<div class="small">${g.radius}m</div>
</div>
`;
});

html += `</div>`;

s.innerHTML = html;
}

/* ===================== TRACKING ===================== */

document.getElementById("trackBtn").onclick = ()=>{

navigator.geolocation.watchPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

if(!userMarker){
userMarker = L.marker([lat,lng]).addTo(map);
}

userMarker.setLatLng([lat,lng]);

if(accuracyCircle) map.removeLayer(accuracyCircle);

accuracyCircle = L.circle([lat,lng],{
radius:pos.coords.accuracy,
color:"#3b82f6",
fillOpacity:0.1
}).addTo(map);

geofences.forEach(g=>{
const d = dist(lat,lng,g.lat,g.lng);
const inZone = d < g.radius;

if(inZone && !inside[g.id]){
inside[g.id]=true;
}

if(!inZone && inside[g.id]){
inside[g.id]=false;
}

});

render();

},err=>{
alert("Location blocked");
});

};

/* ===================== MAP CLICK ===================== */

map.on("click", async e=>{

const type = prompt("place or geofence");
if(!type) return;

if(type==="place"){

const name = prompt("Name");
const address = await getAddress(e.latlng.lat,e.latlng.lng);

places.push({
id:Date.now(),
name,
lat:e.latlng.lat,
lng:e.latlng.lng,
address
});

save();
drawPlaces();
render();
return;
}

geofences.push({
id:Date.now(),
name:prompt("Geofence name"),
lat:e.latlng.lat,
lng:e.latlng.lng,
radius:200
});

save();
drawGeofences();
render();

});

/* ===================== INIT ===================== */

drawPlaces();
drawGeofences();
render();

</script>

</body>
</html>
