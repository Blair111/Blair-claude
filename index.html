<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoSocial v1</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial;
background:#0b1220;
overflow:hidden;
}

#topbar{
height:50px;
background:#111827;
color:white;
display:flex;
align-items:center;
padding:0 12px;
gap:10px;
border-bottom:1px solid #1f2937;
}

button{
background:#2563eb;
color:white;
border:none;
border-radius:8px;
padding:6px 10px;
cursor:pointer;
}

#container{
display:flex;
height:calc(100vh - 50px);
}

#sidebar{
width:340px;
background:#111827;
color:white;
overflow:auto;
padding:10px;
border-right:1px solid #1f2937;
}

#map{
flex:1;
}

.card{
background:#1f2937;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.section{
font-size:12px;
opacity:0.7;
margin-bottom:8px;
}

.item{
background:#374151;
padding:8px;
border-radius:8px;
margin-bottom:6px;
}

.small{
font-size:12px;
opacity:0.7;
}

.enter{color:#22c55e;font-weight:bold;}
.exit{color:#ef4444;font-weight:bold;}
</style>
</head>

<body>

<div id="topbar">
<button onclick="startTracking()">Track</button>
<span>GeoSocial v1</span>
</div>

<div id="container">
<div id="sidebar"></div>
<div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ================= MAP ================= */

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

/* ================= DATA ================= */

let places = JSON.parse(localStorage.getItem("places")||"[]");
let geofences = JSON.parse(localStorage.getItem("geofences")||"[]");
let feed = JSON.parse(localStorage.getItem("feed")||"[]");

/* keeps track of whether user is inside zone */
let insideState = JSON.parse(localStorage.getItem("insideState")||"{}");

/* ================= LAYERS ================= */

let placeMarkers=[];
let fenceLayers=[];
let userMarker=null;
let accuracyCircle=null;

/* ================= SAVE ================= */

function save(){
localStorage.setItem("places",JSON.stringify(places));
localStorage.setItem("geofences",JSON.stringify(geofences));
localStorage.setItem("feed",JSON.stringify(feed));
localStorage.setItem("insideState",JSON.stringify(insideState));
}

/* ================= DIST ================= */

function distance(a,b,c,d){
const R=6371000;
const dLat=(c-a)*Math.PI/180;
const dLng=(d-b)*Math.PI/180;

const x=
Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*
Math.cos(c*Math.PI/180)*
Math.sin(dLng/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/* ================= FEED ================= */

function addFeed(type,text){

feed.unshift({
time:new Date().toLocaleTimeString(),
type,
text
});

if(feed.length>80) feed.pop();

save();
render();
}

/* ================= DRAW ================= */

function drawPlaces(){

placeMarkers.forEach(m=>map.removeLayer(m));
placeMarkers=[];

places.forEach(p=>{
const m=L.marker([p.lat,p.lng]).addTo(map);
m.bindPopup(p.name);
placeMarkers.push(m);
});
}

function drawGeofences(){

fenceLayers.forEach(f=>map.removeLayer(f));
fenceLayers=[];

geofences.forEach(g=>{
const c=L.circle([g.lat,g.lng],{
radius:g.radius,
color:"orange",
fillOpacity:0.2
}).addTo(map);

c.bindPopup(g.name);
fenceLayers.push(c);
});
}

/* ================= TRACKING ENGINE ================= */

function startTracking(){

if(!navigator.geolocation){
alert("No GPS");
return;
}

navigator.geolocation.watchPosition(pos=>{

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;
const acc=pos.coords.accuracy;

/* user marker */
if(!userMarker){
userMarker=L.marker([lat,lng]).addTo(map);
}

userMarker.setLatLng([lat,lng]);

/* accuracy circle */
if(accuracyCircle) map.removeLayer(accuracyCircle);

accuracyCircle=L.circle([lat,lng],{
radius:acc,
color:"#3b82f6",
fillOpacity:0.1
}).addTo(map);

/* GEOFENCE DETECTION */
geofences.forEach(g=>{

const d=distance(lat,lng,g.lat,g.lng);
const inside=d<g.radius;

/* ENTER */
if(inside && !insideState[g.id]){
insideState[g.id]=true;

addFeed(
"ENTER",
"Entered " + g.name
);
}

/* EXIT */
if(!inside && insideState[g.id]){
insideState[g.id]=false;

addFeed(
"EXIT",
"Left " + g.name
);
}

});

map.setView([lat,lng],15);

save();

},err=>{
alert("Location blocked");
});
}

/* ================= MAP CLICK ================= */

map.on("click",e=>{

const type=prompt("place or geofence");
if(!type)return;

if(type==="place"){

places.push({
id:Date.now(),
name:prompt("name"),
lat:e.latlng.lat,
lng:e.latlng.lng
});

save();
drawPlaces();
render();
return;
}

geofences.push({
id:Date.now(),
name:prompt("name"),
lat:e.latlng.lat,
lng:e.latlng.lng,
radius:200
});

save();
drawGeofences();
render();

});

/* ================= SIDEBAR ================= */

function render(){

const s=document.getElementById("sidebar");

let html="";

/* FEED */
html+=`
<div class="card">
<div class="section">LIVE FEED</div>
`;

if(feed.length===0){
html+="No activity yet";
}else{

feed.forEach(f=>{
html+=`
<div class="item">
<div class="${f.type==="ENTER"?"enter":"exit"}">
${f.type}
</div>
<div class="small">${f.time}</div>
<div>${f.text}</div>
</div>
`;
});
}

html+=`</div>`;

/* PLACES */
html+=`
<div class="card">
<div class="section">PLACES</div>
`;

places.forEach(p=>{
html+=`
<div class="item">
<b>${p.name}</b>
</div>
`;
});

html+=`</div>`;

/* GEOFENCES */
html+=`
<div class="card">
<div class="section">GEOFENCES</div>
`;

geofences.forEach(g=>{
html+=`
<div class="item">
<b>${g.name}</b>
<div class="small">${g.radius}m</div>
</div>
`;
});

html+=`</div>`;

s.innerHTML=html;
}

/* ================= INIT ================= */

drawPlaces();
drawGeofences();
render();

</script>

</body>
</html>
