<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Live Location Map</title>

<!-- Leaflet map library -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 {
    margin: 15px 0;
}

button {
    padding: 12px 20px;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 15px;
}

#info {
    margin: 10px 0 20px 0;
    font-size: 16px;
}

#map {
    height: 500px;
    width: 100%;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>My Live Location Map</h1>

<button onclick="startTracking()">Show My Location</button>

<div id="info">Click the button to load your map</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;
let marker;

function startTracking() {

    const info = document.getElementById("info");

    if (!navigator.geolocation) {
        info.innerHTML = "Geolocation not supported";
        return;
    }

    info.innerHTML = "Getting location...";

    navigator.geolocation.getCurrentPosition(
        function(position) {

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            info.innerHTML = `
                Latitude: ${lat}<br>
                Longitude: ${lng}
            `;

            // Create map (only once)
            if (!map) {
                map = L.map('map').setView([lat, lng], 16);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);

                marker = L.marker([lat, lng]).addTo(map)
                    .bindPopup("You are here")
                    .openPopup();
            } else {
                map.setView([lat, lng], 16);
                marker.setLatLng([lat, lng]);
            }
        },

        function(error) {
            info.innerHTML = "Error: " + error.message;
        },

        {
            enableHighAccuracy: false,
            timeout: 30000,
            maximumAge: 60000
        }
    );
}

</script>

</body>
</html>
