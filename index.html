<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Geofence Map FIXED</title>

<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial;
}

#topbar{
background:#111827;
color:white;
padding:10px;
display:flex;
gap:10px;
align-items:center;
}

button{
padding:8px 12px;
border:0;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
}

#map{
height:calc(100vh - 50px);
width:100%;
}

#feed{
position:fixed;
right:10px;
top:70px;
width:280px;
max-height:70vh;
overflow:auto;
background:white;
color:black;
padding:10px;
border:1px solid #ccc;
display:none;
z-index:9999;
}

.item{
padding:5px;
border-bottom:1px solid #eee;
font-size:13px;
}
</style>
</head>

<body>

<div id="topbar">
<button id="trackBtn">Track</button>
<button id="feedBtn">Feed</button>
<span id="info">Ready</span>
</div>

<div id="map"></div>
<div id="feed"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

console.log("SCRIPT LOADED OK");

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OSM'
}).addTo(map);

/* STATE */
let geofences = [];
let feed = [];
let enter = {};
let open = false;
let userMarker = null;
let circles = [];

/* =====================
   FEED
===================== */

function renderFeed(){
const f = document.getElementById("feed");

if(feed.length === 0){
f.innerHTML = "<div class='item'>No activity yet</div>";
return;
}

f.innerHTML = feed.map(x =>
`<div class='item'><b>${x.t}</b><br>${x.m}</div>`
).join("");
}

function addFeed(msg){
feed.unshift({t:new Date().toLocaleTimeString(), m:msg});
renderFeed();
}

/* FEED BUTTON */
document.getElementById("feedBtn").onclick = () => {
const f = document.getElementById("feed");
open = !open;
f.style.display = open ? "block" : "none";
renderFeed();
};

/* =====================
   SHOW GEOFENCES (IMPORTANT FIX)
===================== */

function drawGeofences(){

circles.forEach(c => map.removeLayer(c));
circles = [];

geofences.forEach(g => {

const circle = L.circle([g.lat,g.lng],{
radius:g.r,
color:"orange",
fillColor:"orange",
fillOpacity:0.2
}).addTo(map);

circles.push(circle);

});

}

/* =====================
   DISTANCE
===================== */

function dist(a,b,c,d){
const R=6371000;
const dLat=(c-a)*Math.PI/180;
const dLng=(d-b)*Math.PI/180;

const x=
Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*
Math.cos(c*Math.PI/180)*
Math.sin(dLng/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/* =====================
   TRACKING
===================== */

document.getElementById("trackBtn").onclick = () => {

navigator.geolocation.watchPosition(p => {

const lat=p.coords.latitude;
const lng=p.coords.longitude;

/* user marker */
if(!userMarker){
userMarker=L.marker([lat,lng]).addTo(map);
}

userMarker.setLatLng([lat,lng]);

/* geofence check */
geofences.forEach(g => {

const d = dist(lat,lng,g.lat,g.lng);
const inside = d < g.r;

if(inside && !enter[g.id]){
enter[g.id]=true;
addFeed("Entered " + g.n);
}

if(!inside && enter[g.id]){
enter[g.id]=false;
addFeed("Left " + g.n);
}

});

map.setView([lat,lng],15);

}, err => alert("Location error"));

};

/* =====================
   CREATE GEOFENCE
===================== */

map.on("click", e => {

const name = prompt("Geofence name");
if(!name) return;

const radius = parseInt(prompt("Radius (m)",200));
if(!radius) return;

geofences.push({
id:Date.now(),
n:name,
lat:e.latlng.lat,
lng:e.latlng.lng,
r:radius
});

/* 🔥 FIX: actually draw it */
drawGeofences();

alert("Geofence created");

});

/* INIT */
renderFeed();

</script>

</body>
</html>
