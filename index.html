<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nearby Explorer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
    margin: 0;
    font-family: Arial;
    height: 100vh;
}

/* Top bar */
#topbar {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

/* Main layout */
#container {
    display: flex;
    height: calc(100vh - 60px);
}

/* LEFT LIST */
#list {
    width: 35%;
    overflow-y: auto;
    border-right: 1px solid #ddd;
    background: #fafafa;
}

/* MAP */
#map {
    width: 65%;
}

/* LIST ITEMS */
.place {
    padding: 12px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    background: white;
}

.place:hover {
    background: #f0f0f0;
}

.name {
    font-weight: bold;
}

.distance {
    font-size: 12px;
    color: gray;
}
</style>
</head>

<body>

<div id="topbar">
    <button onclick="findPlaces()">Find Nearby Places</button>
    <span id="info">Click to load</span>
</div>

<div id="container">
    <div id="list">No places loaded</div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;
let userLat, userLng;
let userMarker;
let markers = [];
let placesData = [];

function findPlaces() {

    document.getElementById("info").innerText = "Getting location...";

    navigator.geolocation.getCurrentPosition(async function(pos) {

        userLat = pos.coords.latitude;
        userLng = pos.coords.longitude;

        if (!map) {
            map = L.map('map').setView([userLat, userLng], 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
        }

        // reset markers
        if (userMarker) map.removeLayer(userMarker);
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        userMarker = L.marker([userLat, userLng])
            .addTo(map)
            .bindPopup("You are here");

        map.setView([userLat, userLng], 15);

        const query = `
        [out:json][timeout:25];
        (
          node["amenity"~"cafe|restaurant|fast_food"](around:8000,${userLat},${userLng});
          node["shop"](around:8000,${userLat},${userLng});
        );
        out;
        `;

        const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

        try {

            const res = await fetch(url);
            const data = await res.json();

            placesData = data.elements.map(el => {

                const name = el.tags?.name || "Unknown place";

                const distance = getDistance(
                    userLat, userLng,
                    el.lat, el.lon
                );

                return {
                    name,
                    lat: el.lat,
                    lng: el.lon,
                    distance
                };
            });

            // sort by distance
            placesData.sort((a, b) => a.distance - b.distance);

            renderList();
            renderMarkers();

            document.getElementById("info").innerText =
                `Found ${placesData.length} places`;

        } catch (e) {
            console.log(e);
            document.getElementById("info").innerText =
                "Error loading nearby places";
        }

    }, function(err) {
        document.getElementById("info").innerText =
            "Location error: " + err.message;
    });
}

function renderList() {

    const list = document.getElementById("list");
    list.innerHTML = "";

    placesData.forEach((p, i) => {

        const div = document.createElement("div");
        div.className = "place";

        div.innerHTML = `
            <div class="name">${p.name}</div>
            <div class="distance">${p.distance.toFixed(0)}m away</div>
        `;

        div.onclick = () => {
            map.setView([p.lat, p.lng], 17);
            markers[i].openPopup();
        };

        list.appendChild(div);
    });
}

function renderMarkers() {

    placesData.forEach((p) => {

        const marker = L.marker([p.lat, p.lng])
            .addTo(map)
            .bindPopup(`
                <b>${p.name}</b><br>
                ${p.distance.toFixed(0)}m away<br>
                <button onclick="openDirections(${p.lat}, ${p.lng})">
                    Directions
                </button>
            `);

        markers.push(marker);
    });
}

// distance calculation
function getDistance(lat1, lon1, lat2, lon2) {

    const R = 6371e3;

    const φ1 = lat1 * Math.PI/180;
    const φ2 = lat2 * Math.PI/180;

    const Δφ = (lat2-lat1) * Math.PI/180;
    const Δλ = (lon2-lon1) * Math.PI/180;

    const a =
        Math.sin(Δφ/2) * Math.sin(Δφ/2) +
        Math.cos(φ1) * Math.cos(φ2) *
        Math.sin(Δλ/2) * Math.sin(Δλ/2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

    return R * c;
}

function openDirections(lat, lng) {

    navigator.geolocation.getCurrentPosition(function(pos) {

        const url =
            "https://www.google.com/maps/dir/?api=1" +
            "&origin=" + pos.coords.latitude + "," + pos.coords.longitude +
            "&destination=" + lat + "," + lng;

        window.open(url, "_blank");
    });
}

</script>

</body>
</html>
