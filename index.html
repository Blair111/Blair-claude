<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Map + Personal Places</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
    margin: 0;
    font-family: Arial;
    height: 100vh;
}

#topbar {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    gap: 10px;
}

#container {
    display: flex;
    height: calc(100vh - 60px);
}

#list {
    width: 35%;
    overflow-y: auto;
    border-right: 1px solid #ddd;
    background: #fafafa;
}

#map {
    width: 65%;
}

.place {
    padding: 12px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    background: white;
}

.place:hover {
    background: #f0f0f0;
}

.name {
    font-weight: bold;
}

.distance {
    font-size: 12px;
    color: gray;
}

.small-btn {
    font-size: 12px;
    padding: 6px 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="topbar">
    <button onclick="findPlaces()">Find Nearby Places</button>
    <span id="info">Click to load</span>
</div>

<div id="container">
    <div id="list">No places loaded</div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;
let userLat, userLng;
let userMarker;
let markers = [];
let placesData = [];

// ======================
// PERSONAL PLACES STORAGE
// ======================
let savedPlaces = JSON.parse(localStorage.getItem("savedPlaces") || "[]");

// ======================
// INIT MAP CLICK TO SAVE
// ======================
function enableMapClickSave() {

    map.on("click", function(e) {

        const name = prompt("Name this place (e.g. Cafe, Future visit, etc):");

        if (!name) return;

        const newPlace = {
            name,
            lat: e.latlng.lat,
            lng: e.latlng.lng,
            type: "personal"
        };

        savedPlaces.push(newPlace);
        localStorage.setItem("savedPlaces", JSON.stringify(savedPlaces));

        renderSavedPlaces();
    });
}

// ======================
// LOAD NEARBY PLACES
// ======================
function findPlaces() {

    document.getElementById("info").innerText = "Getting location...";

    navigator.geolocation.getCurrentPosition(async function(pos) {

        userLat = pos.coords.latitude;
        userLng = pos.coords.longitude;

        if (!map) {
            map = L.map('map').setView([userLat, userLng], 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            enableMapClickSave();
        }

        if (userMarker) map.removeLayer(userMarker);
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        userMarker = L.marker([userLat, userLng])
            .addTo(map)
            .bindPopup("You are here");

        map.setView([userLat, userLng], 15);

        const query = `
        [out:json][timeout:25];
        (
          node["amenity"~"cafe|restaurant|fast_food"](around:8000,${userLat},${userLng});
          node["shop"](around:8000,${userLat},${userLng});
        );
        out;
        `;

        const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

        try {

            const res = await fetch(url);
            const data = await res.json();

            placesData = data.elements.map(el => {

                const name = el.tags?.name || "Unknown place";

                const distance = getDistance(
                    userLat, userLng,
                    el.lat, el.lon
                );

                return { name, lat: el.lat, lng: el.lon, distance };
            });

            placesData.sort((a, b) => a.distance - b.distance);

            renderList();
            renderMarkers();
            renderSavedPlaces();

            document.getElementById("info").innerText =
                `Found ${placesData.length} places`;

        } catch (e) {
            document.getElementById("info").innerText =
                "Error loading places";
        }

    }, function(err) {
        document.getElementById("info").innerText =
            "Location error: " + err.message;
    });
}

// ======================
// RENDER LIST (LIVE PLACES)
// ======================
function renderList() {

    const list = document.getElementById("list");
    list.innerHTML = "";

    placesData.forEach((p, i) => {

        const div = document.createElement("div");
        div.className = "place";

        div.innerHTML = `
            <div class="name">${p.name}</div>
            <div class="distance">${p.distance.toFixed(0)}m away</div>
        `;

        div.onclick = () => {
            map.setView([p.lat, p.lng], 17);
            markers[i].openPopup();
        };

        list.appendChild(div);
    });
}

// ======================
// RENDER LIVE MARKERS
// ======================
function renderMarkers() {

    placesData.forEach(p => {

        const marker = L.marker([p.lat, p.lng])
            .addTo(map)
            .bindPopup(`
                <b>${p.name}</b><br>
                ${p.distance.toFixed(0)}m away
            `);

        markers.push(marker);
    });
}

// ======================
// RENDER SAVED PLACES
// ======================
function renderSavedPlaces() {

    savedPlaces.forEach(p => {

        L.marker([p.lat, p.lng], {
            icon: L.icon({
                iconUrl: "https://maps.gstatic.com/mapfiles/ms2/micons/blue-dot.png",
                iconSize: [32, 32]
            })
        })
        .addTo(map)
        .bindPopup("📍 " + p.name);
    });
}

// ======================
// DISTANCE FUNCTION
// ======================
function getDistance(lat1, lon1, lat2, lon2) {

    const R = 6371e3;

    const φ1 = lat1 * Math.PI/180;
    const φ2 = lat2 * Math.PI/180;

    const Δφ = (lat2-lat1) * Math.PI/180;
    const Δλ = (lon2-lon1) * Math.PI/180;

    const a =
        Math.sin(Δφ/2) ** 2 +
        Math.cos(φ1) * Math.cos(φ2) *
        Math.sin(Δλ/2) ** 2;

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

    return R * c;
}

</script>

</body>
</html>
