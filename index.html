<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Geo Platform FIXED</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial;
}

#wrap{
display:flex;
height:100vh;
}

#sidebar{
width:340px;
background:#111827;
color:white;
padding:10px;
overflow:auto;
}

#map{
flex:1;
}

.card{
background:#1f2937;
padding:10px;
margin-bottom:10px;
border-radius:8px;
}

button{
padding:8px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div id="wrap">
<div id="sidebar">Loading...</div>
<div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ================= SAFE START ================= */

let supabase = null;

try {
supabase = window.supabase.createClient(
"YOUR_SUPABASE_URL",
"YOUR_SUPABASE_ANON_KEY"
);
} catch (e) {
console.log("Supabase init failed", e);
}

/* ================= MAP ALWAYS LOADS ================= */

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

/* ================= SAFE STATE ================= */

let places = [];
let geofences = [];
let feed = [];
let inside = {};

let userMarker = null;
let accuracyCircle = null;

/* ================= SAFE LOAD ================= */

async function load(){

try {

if(!supabase){
render();
return;
}

const [p,g,f] = await Promise.all([
supabase.from("places").select("*"),
supabase.from("geofences").select("*"),
supabase.from("feed").select("*")
]);

places = p?.data || [];
geofences = g?.data || [];
feed = f?.data || [];

} catch(err){
console.log("LOAD ERROR:",err);
}

render();
draw();
}

load();

/* ================= SAFE SAVE ================= */

async function addFeed(text){

try {
if(supabase){
await supabase.from("feed").insert([{text}]);
}
} catch(e){
console.log(e);
}

feed.unshift({text});
render();
}

/* ================= DISTANCE ================= */

function distance(a,b,c,d){
const R=6371000;
const dLat=(c-a)*Math.PI/180;
const dLng=(d-b)*Math.PI/180;

const x =
Math.sin(dLat/2)**2 +
Math.cos(a*Math.PI/180)*
Math.cos(c*Math.PI/180)*
Math.sin(dLng/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/* ================= DRAW ================= */

let markers=[];
let circles=[];

function draw(){

markers.forEach(m=>map.removeLayer(m));
circles.forEach(c=>map.removeLayer(c));

markers=[];
circles=[];

/* places */
for(const p of places){
if(p.lat==null) continue;

const m = L.marker([p.lat,p.lng]).addTo(map);
m.bindPopup(p.name || "Place");
markers.push(m);
}

/* geofences */
for(const g of geofences){
if(g.lat==null) continue;

const c = L.circle([g.lat,g.lng],{
radius:g.radius||100,
color:"orange",
fillOpacity:0.2
}).addTo(map);

circles.push(c);
}
}

/* ================= TRACKING ================= */

function startTracking(){

if(!navigator.geolocation){
alert("No GPS");
return;
}

navigator.geolocation.watchPosition(async pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;
const acc = pos.coords.accuracy;

if(!userMarker){
userMarker = L.marker([lat,lng]).addTo(map);
}

userMarker.setLatLng([lat,lng]);

if(accuracyCircle){
map.removeLayer(accuracyCircle);
}

accuracyCircle = L.circle([lat,lng],{
radius:acc,
color:"#3b82f6",
fillOpacity:0.1
}).addTo(map);

/* SAFE GEO ENGINE */
for(const g of geofences){

if(!g.lat) continue;

const d = distance(lat,lng,g.lat,g.lng);
const insideNow = d < g.radius;

if(insideNow && !inside[g.id]){
inside[g.id]=true;
await addFeed("Entered " + g.name);
}

if(!insideNow && inside[g.id]){
inside[g.id]=false;
await addFeed("Left " + g.name);
}
}

map.setView([lat,lng],15);

},err=>{
alert("Location blocked");
});
}

/* ================= CLICK ================= */

map.on("click",async e=>{

const type = prompt("place or geofence");
if(!type) return;

if(type==="place"){
const name = prompt("name");

places.push({
id:Date.now(),
name,
lat:e.latlng.lat,
lng:e.latlng.lng
});

await addFeed("Added place " + name);
draw();
render();
return;
}

const name = prompt("geofence name");
const radius = parseInt(prompt("radius","200"));

geofences.push({
id:Date.now(),
name,
lat:e.latlng.lat,
lng:e.latlng.lng,
radius
});

await addFeed("Added geofence " + name);

draw();
render();
});

/* ================= RENDER ================= */

function render(){

const s = document.getElementById("sidebar");

let html = `
<div class="card">
<button onclick="startTracking()">Start Tracking</button>
</div>
`;

/* FEED */
html += `<div class="card"><b>FEED</b>`;

if(feed.length===0){
html += `<div>No activity yet</div>`;
}else{
for(const f of feed){
html += `<div>${f.text}</div>`;
}
}

html += `</div>`;

/* STATUS */
html += `
<div class="card">
Supabase: ${supabase ? "Connected" : "Offline"}
<br>
Places: ${places.length}
<br>
Geofences: ${geofences.length}
</div>
`;

s.innerHTML = html;
}

</script>

</body>
</html>
