<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Geo Platform Supabase</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial;
}

#wrap{
display:flex;
height:100vh;
}

#sidebar{
width:340px;
background:#111827;
color:white;
padding:10px;
overflow:auto;
}

#map{
flex:1;
}

.card{
background:#1f2937;
padding:10px;
margin-bottom:10px;
border-radius:8px;
}

button{
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:5px;
}

.track{
background:#2563eb;
color:white;
}
</style>
</head>

<body>

<div id="wrap">
<div id="sidebar"></div>
<div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabase = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* ================= MAP ================= */

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

/* ================= STATE ================= */

let places = [];
let geofences = [];
let feed = [];
let inside = {};

let userMarker = null;
let accuracyCircle = null;

/* ================= LOAD DATA ================= */

async function loadData(){

const p = await supabase.from("places").select("*");
const g = await supabase.from("geofences").select("*");
const f = await supabase.from("feed").select("*");

places = p.data || [];
geofences = g.data || [];
feed = f.data || [];

render();
drawAll();

}

loadData();

/* ================= SAVE FEED ================= */

async function addFeed(text){

await supabase.from("feed").insert([{
text
}]);

loadData();

}

/* ================= ADD PLACE ================= */

async function addPlace(name,lat,lng){

await supabase.from("places").insert([{
name,
lat,
lng
}]);

loadData();
}

/* ================= ADD GEOFENCE ================= */

async function addGeofence(name,lat,lng,radius){

await supabase.from("geofences").insert([{
name,
lat,
lng,
radius
}]);

loadData();
}

/* ================= DISTANCE ================= */

function distance(a,b,c,d){

const R = 6371000;

const dLat = (c-a)*Math.PI/180;
const dLng = (d-b)*Math.PI/180;

const x =
Math.sin(dLat/2)**2 +
Math.cos(a*Math.PI/180) *
Math.cos(c*Math.PI/180) *
Math.sin(dLng/2)**2;

return R * 2 * Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/* ================= DRAW ================= */

let placeMarkers = [];
let geoLayers = [];

function drawAll(){

placeMarkers.forEach(m=>map.removeLayer(m));
geoLayers.forEach(g=>map.removeLayer(g));

placeMarkers=[];
geoLayers=[];

/* places */
for(let p of places){
const m = L.marker([p.lat,p.lng]).addTo(map);
m.bindPopup(p.name);
placeMarkers.push(m);
}

/* geofences */
for(let g of geofences){
const c = L.circle([g.lat,g.lng],{
radius:g.radius,
color:"orange",
fillOpacity:0.2
}).addTo(map);
c.bindPopup(g.name);
geoLayers.push(c);
}

}

/* ================= TRACKING ================= */

function startTracking(){

navigator.geolocation.watchPosition(async pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;
const acc = pos.coords.accuracy;

if(!userMarker){
userMarker = L.marker([lat,lng]).addTo(map);
}

userMarker.setLatLng([lat,lng]);

if(accuracyCircle){
map.removeLayer(accuracyCircle);
}

accuracyCircle = L.circle([lat,lng],{
radius:acc,
color:"#3b82f6",
fillOpacity:0.1
}).addTo(map);

/* GEO ENGINE */
for(let g of geofences){

const d = distance(lat,lng,g.lat,g.lng);
const insideNow = d < g.radius;

if(insideNow && !inside[g.id]){
inside[g.id] = true;
await addFeed("Entered " + g.name);
}

if(!insideNow && inside[g.id]){
inside[g.id] = false;
await addFeed("Left " + g.name);
}

}

map.setView([lat,lng],15);

});

}

/* ================= MAP CLICK ================= */

map.on("click",async e=>{

const type = prompt("place or geofence");

if(type==="place"){

const name = prompt("name");

await addPlace(name,e.latlng.lat,e.latlng.lng);

return;
}

const name = prompt("geofence name");
const radius = parseInt(prompt("radius","200"));

await addGeofence(name,e.latlng.lat,e.latlng.lng,radius);

});

/* ================= RENDER SIDEBAR ================= */

function render(){

const s = document.getElementById("sidebar");

let html = "";

/* TRACK BUTTON */
html += `
<div class="card">
<button class="track" onclick="startTracking()">Start Tracking</button>
</div>`;

/* FEED */
html += `<div class="card"><b>FEED</b>`;

for(let f of feed){
html += `<div>${f.text}</div>`;
}

html += `</div>`;

/* PLACES */
html += `<div class="card"><b>Places</b>`;

for(let p of places){
html += `<div>${p.name}</div>`;
}

html += `</div>`;

/* GEOFENCES */
html += `<div class="card"><b>Geofences</b>`;

for(let g of geofences){
html += `<div>${g.name} (${g.radius}m)</div>`;
}

html += `</div>`;

s.innerHTML = html;

}

</script>

</body>
</html>
