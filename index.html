<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Map</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial,sans-serif;
}

#topbar{
background:#111827;
color:white;
padding:10px;
display:flex;
gap:15px;
align-items:center;
flex-wrap:wrap;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#map{
height:calc(100vh - 50px);
width:100%;
}

#info{
font-weight:bold;
}

#coords{
color:#93c5fd;
}
</style>
</head>

<body>

<div id="topbar">
<button onclick="trackMe()">Track Me</button>
<span id="info">Ready</span>
<span id="coords">Lat: -- | Lng: --</span>
</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// =====================
// MAP
// =====================

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

// =====================
// STORAGE
// =====================

let places =
JSON.parse(localStorage.getItem('places') || '[]');

let geofences =
JSON.parse(localStorage.getItem('geofences') || '[]');

let markers = [];
let geofenceCircles = [];
let selected = [];
let routeLayer = null;

let userMarker = null;
let accuracyCircle = null;
let activeGeofence = null;

// =====================
// SAVE
// =====================

function savePlaces(){
localStorage.setItem(
'places',
JSON.stringify(places)
);
}

function saveGeofences(){
localStorage.setItem(
'geofences',
JSON.stringify(geofences)
);
}

// =====================
// DISTANCE CALCULATION
// =====================

function distanceMeters(lat1,lng1,lat2,lng2){

const R = 6371000;

const dLat =
(lat2-lat1)*Math.PI/180;

const dLng =
(lng2-lng1)*Math.PI/180;

const a =
Math.sin(dLat/2)**2 +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLng/2)**2;

return R * 2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

}

// =====================
// ADDRESS LOOKUP
// =====================

async function getAddress(lat,lng){

try{

const response = await fetch(
`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`
);

if(!response.ok){
throw new Error("Lookup failed");
}

const data = await response.json();

return data.display_name || "Address not found";

}
catch(err){

console.error(err);

return "Address lookup failed";

}

}

// =====================
// PLACES
// =====================

function renderPlaces(){

markers.forEach(marker=>{
map.removeLayer(marker);
});

markers=[];

places.forEach(place=>{

const marker = L.marker(
[place.lat,place.lng]
)
.addTo(map)
.bindPopup(`
<b>${place.name}</b>
<br><br>

<b>Latitude:</b><br>
${place.lat.toFixed(6)}

<br><br>

<b>Longitude:</b><br>
${place.lng.toFixed(6)}

<br><br>

<b>Address:</b><br>
${place.address}
`);

marker.on('click',()=>{

selected.push(place);

if(selected.length===2){

createRoute(
selected[0],
selected[1]
);

selected=[];

}

});

markers.push(marker);

});

}

// =====================
// GEOFENCES
// =====================

function renderGeofences(){

geofenceCircles.forEach(circle=>{
map.removeLayer(circle);
});

geofenceCircles=[];

geofences.forEach(g=>{

const circle = L.circle(
[g.lat,g.lng],
{
radius:g.radius,
color:"orange",
fillColor:"orange",
fillOpacity:0.15,
weight:2
}
)
.addTo(map)
.bindPopup(`
<b>${g.name}</b>
<br>
Radius: ${g.radius}m
`);

geofenceCircles.push(circle);

});

}

function createGeofence(lat,lng){

const name =
prompt("Geofence name");

if(!name) return;

const radius =
parseInt(
prompt("Radius in metres","200")
);

if(!radius) return;

geofences.push({
name,
lat,
lng,
radius
});

saveGeofences();
renderGeofences();

document.getElementById("info").innerText =
"Geofence created";

}

// =====================
// ROUTING
// =====================

async function createRoute(a,b){

try{

const url =
`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;

const response =
await fetch(url);

const data =
await response.json();

if(!data.routes ||
!data.routes.length){

document.getElementById("info").innerText =
"No route found";

return;

}

if(routeLayer){
map.removeLayer(routeLayer);
}

routeLayer =
L.geoJSON(
data.routes[0].geometry,
{
style:{
color:"blue",
weight:5
}
}
).addTo(map);

map.fitBounds(
routeLayer.getBounds()
);

const km =
(data.routes[0].distance/1000)
.toFixed(2);

const mins =
(data.routes[0].duration/60)
.toFixed(1);

document.getElementById("info").innerText =
`${a.name} → ${b.name} | ${km} km | ${mins} mins`;

}
catch(err){

console.error(err);

document.getElementById("info").innerText =
"Routing error";

}

}

// =====================
// LOCATION TRACKING
// =====================

function trackMe(){

if(!navigator.geolocation){

alert(
"Geolocation not supported"
);

return;

}

navigator.geolocation.watchPosition(

(position)=>{

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;

const accuracy =
position.coords.accuracy;

if(!userMarker){

const userIcon =
L.divIcon({

html:`
<div style="
width:20px;
height:20px;
background:#2563eb;
border:3px solid white;
border-radius:50%;
box-shadow:0 0 12px rgba(37,99,235,0.9);
"></div>
`,

className:"",
iconSize:[20,20]

});

userMarker =
L.marker(
[lat,lng],
{
icon:userIcon
}
)
.addTo(map)
.bindPopup(
"You are here"
);

}

userMarker.setLatLng(
[lat,lng]
);

if(accuracyCircle){

map.removeLayer(
accuracyCircle
);

}

accuracyCircle =
L.circle(
[lat,lng],
{
radius:accuracy,
color:"#2563eb",
fillColor:"#2563eb",
fillOpacity:0.15,
weight:1
}
).addTo(map);

geofences.forEach(g=>{

const d =
distanceMeters(
lat,
lng,
g.lat,
g.lng
);

if(
d < g.radius &&
activeGeofence !== g.name
){

activeGeofence =
g.name;

document.getElementById("info").innerText =
`Entered ${g.name}`;

}

if(
d > g.radius &&
activeGeofence === g.name
){

activeGeofence =
null;

document.getElementById("info").innerText =
`Left ${g.name}`;

}

});

map.setView(
[lat,lng],
15
);

},

(error)=>{

document.getElementById("info").innerText =
"Location unavailable";

}

);

}

// =====================
// LIVE COORDINATES
// =====================

map.on(
'mousemove',
(e)=>{

document.getElementById("coords")
.innerText =
`Lat: ${e.latlng.lat.toFixed(6)} | Lng: ${e.latlng.lng.toFixed(6)}`;

}
);

// =====================
// MAP CLICK
// =====================

map.on(
'click',
async (e)=>{

const mode =
prompt(
"Type: place or geofence"
);

if(!mode) return;

if(
mode.toLowerCase() ===
"geofence"
){

createGeofence(
e.latlng.lat,
e.latlng.lng
);

return;

}

const name =
prompt(
"Location name"
);

if(!name) return;

document.getElementById("info")
.innerText =
"Finding address...";

const address =
await getAddress(
e.latlng.lat,
e.latlng.lng
);

places.push({

name:name,
lat:e.latlng.lat,
lng:e.latlng.lng,
address:address

});

savePlaces();
renderPlaces();

document.getElementById("info")
.innerText =
"Saved";

}
);

// =====================
// STARTUP
// =====================

renderPlaces();
renderGeofences();

</script>

</body>
</html>
