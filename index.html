<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nearby Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
    font-family: Arial;
    margin: 0;
    padding: 15px;
    text-align: center;
}

button {
    padding: 10px 15px;
    margin: 5px;
    cursor: pointer;
}

#map {
    height: 500px;
    width: 100%;
    margin-top: 10px;
}

#info {
    margin: 10px;
}
</style>
</head>

<body>

<h2>Nearby Places Map</h2>

<button onclick="findPlaces()">Find Nearby Places</button>

<div id="info">Click button to start</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;
let userMarker;
let placeMarkers = [];

function findPlaces() {

    document.getElementById("info").innerText = "Getting location...";

    navigator.geolocation.getCurrentPosition(async function(pos) {

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        document.getElementById("info").innerText = "Loading nearby places...";

        if (!map) {
            map = L.map('map').setView([lat, lng], 16);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
        }

        if (userMarker) map.removeLayer(userMarker);
        placeMarkers.forEach(m => map.removeLayer(m));
        placeMarkers = [];

        userMarker = L.marker([lat, lng]).addTo(map)
            .bindPopup("You are here");

        map.setView([lat, lng], 16);

        const query = `
        [out:json];
        (
          node["amenity"~"cafe|restaurant|fast_food"](around:1000,${lat},${lng});
          node["shop"](around:1000,${lat},${lng});
        );
        out;
        `;

        const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

        try {
            const res = await fetch(url);
            const data = await res.json();

            data.elements.forEach(el => {

                const name = el.tags?.name || "Unknown place";

                const marker = L.marker([el.lat, el.lon]).addTo(map);

                marker.bindPopup(`
                    <b>${name}</b><br>
                    <button onclick="openDirections(${el.lat}, ${el.lon})">
                        Get Directions
                    </button>
                `);

                placeMarkers.push(marker);
            });

            document.getElementById("info").innerText =
                `Found ${data.elements.length} places`;

        } catch (e) {
            document.getElementById("info").innerText =
                "Error loading nearby places";
        }

    }, function(err) {
        document.getElementById("info").innerText =
            "Location error: " + err.message;
    });
}

function openDirections(lat, lng) {

    navigator.geolocation.getCurrentPosition(function(pos) {

        const userLat = pos.coords.latitude;
        const userLng = pos.coords.longitude;

        const url =
            "https://www.google.com/maps/dir/?api=1" +
            "&origin=" + userLat + "," + userLng +
            "&destination=" + lat + "," + lng;

        window.open(url, "_blank");
    });
}

</script>

</body>
</html>
