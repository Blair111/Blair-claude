<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GeoPlatform V2</title>

<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
margin:0;
height:100%;
font-family:Arial,sans-serif;
background:#0f172a;
overflow:hidden;
}

#topbar{
height:55px;
background:#111827;
color:white;
display:flex;
align-items:center;
padding:0 15px;
gap:10px;
border-bottom:1px solid #1f2937;
}

button{
background:#2563eb;
color:white;
border:none;
border-radius:8px;
padding:8px 12px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#container{
display:flex;
height:calc(100vh - 55px);
}

#sidebar{
width:340px;
background:#111827;
color:white;
overflow-y:auto;
padding:12px;
border-right:1px solid #1f2937;
}

#map{
flex:1;
}

.card{
background:#1f2937;
padding:12px;
border-radius:10px;
margin-bottom:12px;
}

.section-title{
font-size:12px;
font-weight:bold;
opacity:0.7;
margin-bottom:10px;
letter-spacing:1px;
}

.item{
background:#374151;
padding:8px;
border-radius:8px;
margin-bottom:8px;
}

.small{
font-size:12px;
opacity:0.8;
}

.action-row{
margin-top:8px;
display:flex;
gap:6px;
flex-wrap:wrap;
}

.action-row button{
padding:5px 8px;
font-size:12px;
}

.archive-btn{
background:#dc2626;
}

.restore-btn{
background:#16a34a;
}

.zoom-btn{
background:#2563eb;
}

</style>
</head>

<body>

<div id="topbar">

<button id="trackBtn">
Start Tracking
</button>


<span id="status">
Ready
</span>

</div>

<div id="container">

<div id="sidebar"></div>

<div id="map"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ==========================
MAP
========================== */

const map =
L.map('map')
.setView([55.9533,-3.1883],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

/* ==========================
STORAGE
========================== */

let places =
JSON.parse(
localStorage.getItem('places') || '[]'
);

let geofences =
JSON.parse(
localStorage.getItem('geofences') || '[]'
);

let archivedGeofences =
JSON.parse(
localStorage.getItem('archivedGeofences') || '[]'
);

let feed =
JSON.parse(
localStorage.getItem('feed') || '[]'
);

let insideState =
JSON.parse(
localStorage.getItem('insideState') || '{}'
);

/* ==========================
STATE
========================== */

let geofenceLayers = [];

let placeMarkers = [];

let userMarker = null;
let accuracyCircle = null;

let totalEntries = 0;
let totalExits = 0;

let routeStart = null;
let routeEnd = null;
let routeLayer = null;
let routeDistance = null;
let routeDuration = null;

/* ==========================
SAVE
========================== */

function saveData(){

localStorage.setItem(
'places',
JSON.stringify(places)
);

localStorage.setItem(
'geofences',
JSON.stringify(geofences)
);

localStorage.setItem(
'archivedGeofences',
JSON.stringify(archivedGeofences)
);

localStorage.setItem(
'feed',
JSON.stringify(feed)
);

localStorage.setItem(
'insideState',
JSON.stringify(insideState)
);

}

/* ==========================
FEED
========================== */

function addFeed(text){

feed.unshift({

time:new Date()
.toLocaleTimeString(),

text:text

});

if(feed.length > 100){
feed.pop();
}

saveData();
renderSidebar();

}

/* ==========================
REVERSE GEOCODER
========================== */

async function getAddress(lat,lng){

try{

const response =
await fetch(
`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`
);

const data =
await response.json();

return data.display_name || "Unknown";

}
catch{

return "Unknown";

}

}

/* ==========================
DRAW PLACES
========================== */

function drawPlaces(){

placeMarkers.forEach(m=>{
map.removeLayer(m);
});

placeMarkers=[];

places.forEach(place=>{

const marker =
L.marker([
place.lat,
place.lng
])
.addTo(map);

marker.bindPopup(
"<b>"+place.name+"</b>"
);

placeMarkers.push(marker);

});

}

/* ==========================
DRAW GEOFENCES
========================== */

function drawGeofences(){

geofenceLayers.forEach(layer=>{
map.removeLayer(layer);
});

geofenceLayers=[];

geofences.forEach(g=>{

const circle =
L.circle(
[g.lat,g.lng],
{
radius:g.radius,
color:'orange',
fillOpacity:0.2
}
)
.addTo(map);

circle.bindPopup(
"<b>"+g.name+"</b><br>"
+
g.radius
+
"m"
);

geofenceLayers.push(circle);

});

}

/* ==========================
ARCHIVE
========================== */

function archiveGeofence(id){

const fence =
geofences.find(
g=>g.id===id
);

if(!fence) return;

fence.deletedAt =
new Date()
.toLocaleString();

archivedGeofences.push(
fence
);

geofences =
geofences.filter(
g=>g.id!==id
);

delete insideState[id];

addFeed(
"Archived geofence: "
+
fence.name
);

saveData();

drawGeofences();

renderSidebar();

}
/* ==========================
ROUTING
========================== */

async function createRoute(start,end){

try{

const url =
`https://router.project-osrm.org/route/v1/driving/${start.lng},${start.lat};${end.lng},${end.lat}?overview=full&geometries=geojson`;

const response =
await fetch(url);

const data =
await response.json();

if(!data.routes || !data.routes.length){

alert("No route found");
return;

}

if(routeLayer){

map.removeLayer(routeLayer);

}

routeLayer =
L.geoJSON(
data.routes[0].geometry,
{
style:{
color:"blue",
weight:5
}
}
).addTo(map);

map.fitBounds(
routeLayer.getBounds()
);

routeDistance =
(data.routes[0].distance/1000)
.toFixed(1);

routeDuration =
(data.routes[0].duration/60)
.toFixed(0);

renderSidebar();

}
catch(err){

console.error(err);

alert("Routing failed");

}

}

function selectRouteLocation(id){

const place =
places.find(
p=>p.id===id
);

if(!place) return;

if(!routeStart){

routeStart = place;

renderSidebar();

return;

}

if(!routeEnd){

routeEnd = place;

createRoute(
routeStart,
routeEnd
);

renderSidebar();

return;

}

routeStart = place;

routeEnd = null;

routeDistance = null;
routeDuration = null;

if(routeLayer){

map.removeLayer(routeLayer);

routeLayer = null;

}

renderSidebar();

}

function clearRoute(){

routeStart = null;
routeEnd = null;

routeDistance = null;
routeDuration = null;

if(routeLayer){

map.removeLayer(routeLayer);

routeLayer = null;

}

renderSidebar();

}
/* ==========================
RESTORE
========================== */

function restoreGeofence(id){

const fence =
archivedGeofences.find(
g=>g.id===id
);

if(!fence) return;

geofences.push(fence);

archivedGeofences =
archivedGeofences.filter(
g=>g.id!==id
);

addFeed(
"Restored geofence: "
+
fence.name
);

saveData();

drawGeofences();

renderSidebar();

}

/* ==========================
ZOOM
========================== */

function zoomTo(lat,lng){

map.setView(
[lat,lng],
17
);

}

/* ==========================
SIDEBAR
========================== */

function renderSidebar(){

const sidebar =
document.getElementById(
'sidebar'
);

sidebar.innerHTML = `

<div class="card">

<div class="section-title">
LIVE STATS
</div>

<div>
📍 Places:
${places.length}
</div>

<div>
🟠 Active:
${geofences.length}
</div>

<div>
📦 Archived:
${archivedGeofences.length}
</div>

<div>
✅ Entries:
${totalEntries}
</div>

<div>
🚪 Exits:
${totalExits}
</div>

</div>

<div class="card">

<div class="section-title">
SAVED LOCATIONS
</div>

${
places.length===0
?
'None'
:
places.map(place=>`
<div class="item">

<b>${place.name}</b>

<div class="small">
${place.address || ''}
</div>

<div class="action-row">

<button
class="zoom-btn"
onclick="
zoomTo(
${place.lat},
${place.lng}
)
">
Zoom
</button>

<button
onclick="
selectRouteLocation(
${place.id}
)
">
Select
</button>

</div>

</div>
`).join('')
}

</div>

<div class="card">

<div class="section-title">
ACTIVE GEOFENCES
</div>

${
geofences.length===0
?
'None'
:
geofences.map(g=>`
<div class="item">

<b>${g.name}</b>

<div class="small">
${g.radius}m
</div>

<div class="action-row">

<button
class="zoom-btn"
onclick="
zoomTo(
${g.lat},
${g.lng}
)
">
Zoom
</button>

<button
class="archive-btn"
onclick="
archiveGeofence(
${g.id}
)
">
Archive
</button>

</div>

</div>
`).join('')
}

</div>

<div class="card">

<div class="section-title">
ARCHIVED GEOFENCES
</div>

${
archivedGeofences.length===0
?
'None'
:
archivedGeofences.map(g=>`
<div class="item">

<b>${g.name}</b>

<div class="small">
Deleted:
${g.deletedAt}
</div>

<div class="action-row">

<button
class="restore-btn"
onclick="
restoreGeofence(
${g.id}
)
">
Restore
</button>

</div>

</div>
`).join('')
}
/* ==========================
SIDEBAR
========================== */

function renderSidebar(){

const sidebar =
document.getElementById(
'sidebar'
);

sidebar.innerHTML = `

<div class="card">


/* ==========================
ADD OBJECTS
========================== */

map.on(
'click',
async e=>{

const type =
prompt(
'place or geofence'
);

if(!type) return;

if(
type.toLowerCase()
===
'place'
){

const name =
prompt(
'Location name'
);

if(!name) return;

const address =
await getAddress(
e.latlng.lat,
e.latlng.lng
);

places.push({

id:Date.now(),

name:name,

lat:e.latlng.lat,

lng:e.latlng.lng,

address:address

});

saveData();

drawPlaces();

renderSidebar();

return;

}

const name =
prompt(
'Geofence name'
);

if(!name) return;

const radius =
parseInt(
prompt(
'Radius',
'200'
)
);

geofences.push({

id:Date.now(),

name:name,

lat:e.latlng.lat,

lng:e.latlng.lng,

radius:radius

});

saveData();

drawGeofences();

renderSidebar();

}
);
document
.getElementById(
'trackBtn'
)
.onclick = ()=>{

if(
!navigator.geolocation
){
alert(
'Location unsupported'
);
return;
}

navigator.geolocation.watchPosition(

position=>{

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;

const accuracy =
position.coords.accuracy;

if(!userMarker){

const icon =
L.divIcon({

html:`
<div style="
width:20px;
height:20px;
background:#2563eb;
border:3px solid white;
border-radius:50%;
box-shadow:0 0 10px rgba(37,99,235,.8);
"></div>
`,

className:''

});

userMarker =
L.marker(
[lat,lng],
{
icon
}
)
.addTo(map);

}

userMarker.setLatLng(
[lat,lng]
);

if(
accuracyCircle
){
map.removeLayer(
accuracyCircle
);
}

accuracyCircle =
L.circle(
[lat,lng],
{
radius:accuracy,
color:'#2563eb',
fillOpacity:0.1
}
)
.addTo(map);

geofences.forEach(g=>{

const d =
map.distance(
[lat,lng],
[g.lat,g.lng]
);

const inside =
d < g.radius;

if(
inside &&
!insideState[g.id]
){

insideState[g.id]=true;

totalEntries++;

addFeed(
'Entered ' + g.name
);

}

if(
!inside &&
insideState[g.id]
){

insideState[g.id]=false;

totalExits++;

addFeed(
'Left ' + g.name
);
}

});

document
.getElementById(
'status'
)
.innerText =
'Tracking';

},

err=>{

alert(
'Location permission denied'
);

}

);

};
/* ==========================
STARTUP
========================== */

drawPlaces();
drawGeofences();
renderSidebar();

feed.forEach(item=>{

if(
item.text.includes(
'Entered'
)
||
item.text.includes(
'CHECK-IN'
)
){
totalEntries++;
}

if(
item.text.includes(
'Left'
)
||
item.text.includes(
'CHECK-OUT'
)
){
totalExits++;
}

});

</script>

</body>
</html>
