<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Map v1.0.1</title>

<!-- STOP favicon 404 error -->
<link rel="icon" href="data:,">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial,sans-serif;
}

#topbar{
background:#111827;
color:white;
padding:10px;
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#map{
height:calc(100vh - 50px);
width:100%;
}

#info{
font-weight:bold;
}

#coords{
color:#93c5fd;
}

#feed{
position:absolute;
right:10px;
top:70px;
width:260px;
max-height:60vh;
overflow:auto;
background:#111827;
color:white;
padding:10px;
border-radius:10px;
font-size:12px;
display:none;
}
</style>
</head>

<body>

<div id="topbar">
<button onclick="trackMe()">Track Me</button>
<button onclick="toggleFeed()">Feed</button>
<span id="info">Ready</span>
<span id="coords">Lat: -- | Lng: --</span>
</div>

<div id="map"></div>
<div id="feed"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js?v=1"></script>

<script>

// =====================
// MAP INIT
// =====================

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

// =====================
// CACHE-SAFE STORAGE
// =====================

let places = JSON.parse(localStorage.getItem('places') || '[]');
let geofences = JSON.parse(localStorage.getItem('geofences') || '[]');
let experiences = JSON.parse(localStorage.getItem('experiences') || '[]');
let feedItems = JSON.parse(localStorage.getItem('feed') || '[]');

// =====================
// STATE
// =====================

let markers = [];
let geofenceCircles = [];
let routeLayer = null;

let userMarker = null;
let accuracyCircle = null;

let activeGeofence = null;
let enterTimes = {};

// =====================
// SAVE
// =====================

function save(){
localStorage.setItem('places', JSON.stringify(places));
localStorage.setItem('geofences', JSON.stringify(geofences));
localStorage.setItem('experiences', JSON.stringify(experiences));
localStorage.setItem('feed', JSON.stringify(feedItems));
}

// =====================
// FEED SYSTEM
// =====================

function addFeed(text){
const item = {
text,
time:new Date().toLocaleTimeString()
};

feedItems.unshift(item);
save();
renderFeed();
}

function renderFeed(){
const feed = document.getElementById("feed");
feed.innerHTML = feedItems.map(i =>
`<div style="padding:6px;border-bottom:1px solid #333">
${i.time} - ${i.text}
</div>`
).join("");
}

function toggleFeed(){
const f = document.getElementById("feed");
f.style.display = f.style.display === "none" ? "block" : "none";
}

// =====================
// DISTANCE
// =====================

function distanceMeters(lat1,lng1,lat2,lng2){
const R = 6371000;
const dLat = (lat2-lat1)*Math.PI/180;
const dLng = (lng2-lng1)*Math.PI/180;

const a =
Math.sin(dLat/2)**2 +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLng/2)**2;

return R * 2 * Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// =====================
// GEOFENCES
// =====================

function renderGeofences(){

geofenceCircles.forEach(c=>map.removeLayer(c));
geofenceCircles=[];

geofences.forEach(g=>{

const circle = L.circle([g.lat,g.lng],{
radius:g.radius,
color:"orange",
fillOpacity:0.15
}).addTo(map);

geofenceCircles.push(circle);

});
}

function createGeofence(lat,lng){

const name = prompt("Geofence name");
if(!name) return;

const radius = parseInt(prompt("Radius (m)",200));
if(!radius) return;

geofences.push({
id:Date.now(),
name,
lat,
lng,
radius
});

save();
renderGeofences();
}

// =====================
// TRACKING
// =====================

function trackMe(){

navigator.geolocation.watchPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;
const accuracy = pos.coords.accuracy;

// marker
if(!userMarker){
userMarker = L.marker([lat,lng]).addTo(map);
}

userMarker.setLatLng([lat,lng]);

// accuracy
if(accuracyCircle) map.removeLayer(accuracyCircle);

accuracyCircle = L.circle([lat,lng],{
radius:accuracy,
color:"#2563eb",
fillOpacity:0.1
}).addTo(map);

// geofence logic
geofences.forEach(g=>{

const d = distanceMeters(lat,lng,g.lat,g.lng);
const inside = d < g.radius;

if(inside && !enterTimes[g.id]){
enterTimes[g.id] = Date.now();
addFeed(`Entered ${g.name}`);
}

if(!inside && enterTimes[g.id]){
const mins = ((Date.now()-enterTimes[g.id])/60000).toFixed(1);
addFeed(`Left ${g.name} (${mins} min)`);
enterTimes[g.id] = null;
}

});

map.setView([lat,lng],15);

}, err=>{
document.getElementById("info").innerText="Location error";
});
}

// =====================
// MAP CLICK
// =====================

map.on("click",(e)=>{

const mode = prompt("Type: place or geofence");

if(mode === "geofence"){
createGeofence(e.latlng.lat,e.latlng.lng);
return;
}

const name = prompt("Place name");
if(!name) return;

places.push({
id:Date.now(),
name,
lat:e.latlng.lat,
lng:e.latlng.lng
});

save();
});

// =====================
// START
// =====================

renderGeofences();
renderFeed();

</script>

</body>
</html>
