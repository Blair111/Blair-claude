<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GeoSocial Stable</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial;
}

#wrap{
display:flex;
height:100vh;
}

#sidebar{
width:320px;
background:#111827;
color:white;
padding:10px;
overflow:auto;
}

#map{
flex:1;
}

.card{
background:#1f2937;
padding:10px;
margin-bottom:10px;
border-radius:8px;
}
</style>
</head>

<body>

<div id="wrap">
<div id="sidebar"></div>
<div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ================= MAP ================= */

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

/* ================= DATA ================= */

let places = JSON.parse(localStorage.getItem("places") || "[]");
let geofences = JSON.parse(localStorage.getItem("geofences") || "[]");
let feed = JSON.parse(localStorage.getItem("feed") || "[]");
let inside = JSON.parse(localStorage.getItem("inside") || "{}");

/* ================= STATE ================= */

let userMarker = null;
let accuracyCircle = null;
let geoWatch = null;

/* ================= SAVE ================= */

function save(){
localStorage.setItem("places", JSON.stringify(places));
localStorage.setItem("geofences", JSON.stringify(geofences));
localStorage.setItem("feed", JSON.stringify(feed));
localStorage.setItem("inside", JSON.stringify(inside));
}

/* ================= DISTANCE ================= */

function dist(lat1,lng1,lat2,lng2){
const R = 6371000;
const dLat = (lat2-lat1)*Math.PI/180;
const dLng = (lng2-lng1)*Math.PI/180;

const a =
Math.sin(dLat/2)**2 +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLng/2)**2;

return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ================= FEED ================= */

function addFeed(text,type){

feed.unshift({
time:new Date().toLocaleTimeString(),
text,
type
});

if(feed.length>50) feed.pop();

save();
render();
}

/* ================= NOTIFY ================= */

function notify(title,body){
if(!("Notification" in window)) return;
if(Notification.permission !== "granted") return;

new Notification(title,{body});
}

/* ================= DRAW ================= */

function draw(){

const el = document.getElementById("sidebar");

let html = "";

/* FEED */
html += `<div class="card"><b>LIVE FEED</b>`;

if(feed.length===0){
html += `<div>No activity yet</div>`;
}else{
for(let f of feed){
html += `
<div>
<b>${f.type}</b><br>
${f.text}<br>
<small>${f.time}</small>
</div><hr>`;
}
}

html += `</div>`;

/* GEOFENCES */
html += `<div class="card"><b>GEOFENCES</b>`;

for(let g of geofences){
html += `<div>${g.name} (${g.radius}m)</div>`;
}

html += `</div>`;

el.innerHTML = html;
}

/* ================= START ================= */

function startTracking(){

if(!navigator.geolocation){
alert("No GPS");
return;
}

if(Notification.permission==="default"){
Notification.requestPermission();
}

geoWatch = navigator.geolocation.watchPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;
const acc = pos.coords.accuracy;

if(!userMarker){
userMarker = L.marker([lat,lng]).addTo(map);
}

userMarker.setLatLng([lat,lng]);

if(accuracyCircle){
map.removeLayer(accuracyCircle);
}

accuracyCircle = L.circle([lat,lng],{
radius:acc,
color:"#3b82f6",
fillOpacity:0.1
}).addTo(map);

/* GEOFENCE ENGINE */
for(let g of geofences){

const d = dist(lat,lng,g.lat,g.lng);
const insideNow = d < g.radius;

/* ENTER */
if(insideNow && !inside[g.id]){
inside[g.id] = true;

addFeed("Entered "+g.name,"ENTER");
notify("Entered zone",g.name);
}

/* EXIT */
if(!insideNow && inside[g.id]){
inside[g.id] = false;

addFeed("Left "+g.name,"EXIT");
notify("Exited zone",g.name);
}

}

map.setView([lat,lng],15);

save();

},err=>{
alert("Location blocked");
});
}

/* ================= MAP CLICK ================= */

map.on("click",e=>{

const type = prompt("place or geofence");
if(!type) return;

if(type==="place"){
places.push({
id:Date.now(),
name:prompt("name"),
lat:e.latlng.lat,
lng:e.latlng.lng
});

save();
draw();
return;
}

geofences.push({
id:Date.now(),
name:prompt("name"),
lat:e.latlng.lat,
lng:e.latlng.lng,
radius:200
});

save();
draw();

});

/* ================= INIT ================= */

draw();

</script>

</body>
</html>
