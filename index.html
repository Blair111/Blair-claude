<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Live Activity Map vFinal</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial;
background:#0f172a;
color:white;
}

#wrap{
display:flex;
height:100vh;
}

#sidebar{
width:340px;
background:#111827;
padding:10px;
overflow:auto;
}

#map{
flex:1;
}

.card{
background:#1f2937;
padding:10px;
margin-bottom:10px;
border-radius:8px;
}

button{
padding:8px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
margin-top:5px;
}
</style>
</head>

<body>

<div id="wrap">
<div id="sidebar">Booting...</div>
<div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* =========================
SUPABASE CONFIG
========================= */

const supabase = createClient(
"https://ihvutyeambhbynjsjnbw.supabase.co",
"sb_publishable_2V_TIKwFpZWLvS1V_vUl_g_HW3WL6pJ"
);

/* =========================
DEVICE ID
========================= */

const device = "Device-" + Math.floor(Math.random()*1000);

/* =========================
MAP
========================= */

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

/* =========================
STATE
========================= */

let places=[];
let geofences=[];
let feed=[];
let inside={};

let markers=[];
let circles=[];

/* =========================
LOAD DATA
========================= */

async function load(){

const p = await supabase.from("places").select("*");
const g = await supabase.from("geofences").select("*");
const f = await supabase.from("feed").select("*");

places = p.data || [];
geofences = g.data || [];
feed = f.data || [];

render();
draw();

}

/* =========================
REALTIME (CORRECT ORDER)
========================= */

function subscribeRealtime(){

const channel = supabase.channel("live-feed");

channel.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"feed"
},
(payload)=>{

feed.unshift(payload.new);
render();

}
);

channel.subscribe();

}

/* =========================
ADD EVENT
========================= */

async function addEvent(type,text){

await supabase.from("feed").insert([{
type,
text,
device
}]);

}

/* =========================
DISTANCE
========================= */

function distance(a,b,c,d){

const R=6371000;

const dLat=(c-a)*Math.PI/180;
const dLng=(d-b)*Math.PI/180;

const x=
Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*
Math.cos(c*Math.PI/180)*
Math.sin(dLng/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/* =========================
DRAW MAP
========================= */

function draw(){

markers.forEach(m=>map.removeLayer(m));
circles.forEach(c=>map.removeLayer(c));

markers=[];
circles=[];

/* places */
for(const p of places){
markers.push(
L.marker([p.lat,p.lng])
.addTo(map)
.bindPopup(p.name || "Place")
);
}

/* geofences (BLUE as requested earlier) */
for(const g of geofences){
circles.push(
L.circle([g.lat,g.lng],{
radius:g.radius,
color:"#3b82f6",
fillColor:"#3b82f6",
fillOpacity:0.25
}).addTo(map)
);
}

}

/* =========================
TRACKING
========================= */

let userMarker=null;
let accuracyCircle=null;

function startTracking(){

navigator.geolocation.watchPosition(async pos=>{

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;
const acc=pos.coords.accuracy;

if(!userMarker){
userMarker=L.marker([lat,lng]).addTo(map);
}

userMarker.setLatLng([lat,lng]);

if(accuracyCircle) map.removeLayer(accuracyCircle);

accuracyCircle=L.circle([lat,lng],{
radius:acc,
color:"#3b82f6",
fillOpacity:0.1
}).addTo(map);

for(const g of geofences){

const d=distance(lat,lng,g.lat,g.lng);
const insideNow=d<g.radius;

if(insideNow && !inside[g.id]){
inside[g.id]=true;
await addEvent("ENTER",g.name);
}

if(!insideNow && inside[g.id]){
inside[g.id]=false;
await addEvent("EXIT",g.name);
}

}

map.setView([lat,lng],15);

});

}

/* =========================
MAP CLICK
========================= */

map.on("click",async e=>{

const type = confirm("OK = Place | Cancel = Geofence");

if(type){

await supabase.from("places").insert([{
id:Date.now(),
name:"Place",
lat:e.latlng.lat,
lng:e.latlng.lng
}]);

}else{

await supabase.from("geofences").insert([{
id:Date.now(),
name:"Geofence",
lat:e.latlng.lat,
lng:e.latlng.lng,
radius:200
}]);

}

load();

});

/* =========================
RENDER UI
========================= */

function render(){

document.getElementById("sidebar").innerHTML=`
<div class="card">
<button onclick="startTracking()">Start Tracking</button>
</div>

<div class="card">
<b>Device:</b> ${device}<br>
<b>Places:</b> ${places.length}<br>
<b>Geofences:</b> ${geofences.length}
</div>

<div class="card">
<b>Live Feed</b><br>
${feed.length ?
feed.map(f=>`
<div style="margin-bottom:6px">
<b>${f.type}</b> ${f.text}<br>
<small>${f.device || ""}</small>
</div>
`).join("")
:
"No activity yet"}
</div>
`;

window.startTracking=startTracking;

}

/* =========================
BOOT SEQUENCE (SAFE ORDER)
========================= */

await load();
subscribeRealtime();
render();
draw();

</script>

</body>
</html>
