<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Map v2</title>

<link rel="icon" href="data:,">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial,sans-serif;
}

/* TOP BAR */
#topbar{
background:#111827;
color:white;
padding:10px;
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

/* MAP */
#map{
height:calc(100vh - 50px);
width:100%;
}

#info{
font-weight:bold;
}

#coords{
color:#93c5fd;
}

/* FEED (FIXED PROPERLY) */
#feed{
position:fixed;
right:10px;
top:70px;
width:300px;
max-height:70vh;
overflow:auto;
background:#111827;
color:white;
padding:10px;
border-radius:10px;
font-size:12px;
z-index:9999;

/* hidden state */
display:none;
}

.feed-item{
padding:6px;
border-bottom:1px solid #1f2937;
}
</style>
</head>

<body>

<div id="topbar">
<button onclick="trackMe()">Track Me</button>
<button onclick="toggleFeed()" id="feedBtn">Feed</button>

<span id="info">Ready</span>
<span id="coords">Lat: -- | Lng: --</span>
</div>

<div id="map"></div>
<div id="feed"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================
   MAP INIT
===================== */

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

/* =====================
   DATA
===================== */

let geofences = JSON.parse(localStorage.getItem('geofences') || '[]');
let feed = JSON.parse(localStorage.getItem('feed') || '[]');

/* =====================
   STATE
===================== */

let userMarker = null;
let accuracyCircle = null;
let enterTimes = {};
let feedOpen = false;

/* =====================
   SAVE
===================== */

function save(){
localStorage.setItem('geofences', JSON.stringify(geofences));
localStorage.setItem('feed', JSON.stringify(feed));
}

/* =====================
   FEED SYSTEM (FIXED)
===================== */

function addFeed(text){

feed.unshift({
text,
time:new Date().toLocaleTimeString()
});

save();

if(feedOpen){
renderFeed();
}
}

function renderFeed(){

const el = document.getElementById("feed");

el.innerHTML = feed.map(i => `
<div class="feed-item">
<b>${i.time}</b><br>
${i.text}
</div>
`).join("");

}

/* =====================
   TOGGLE FEED (100% STABLE)
===================== */

function toggleFeed(){

const el = document.getElementById("feed");
const btn = document.getElementById("feedBtn");

feedOpen = !feedOpen;

if(feedOpen){
el.style.display = "block";
btn.innerText = "Close Feed";
renderFeed();
} else {
el.style.display = "none";
btn.innerText = "Feed";
}

}

/* =====================
   DISTANCE
===================== */

function distanceMeters(lat1,lng1,lat2,lng2){

const R = 6371000;
const dLat = (lat2-lat1)*Math.PI/180;
const dLng = (lng2-lng1)*Math.PI/180;

const a =
Math.sin(dLat/2)**2 +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLng/2)**2;

return R * 2 * Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* =====================
   TRACKING
===================== */

function trackMe(){

navigator.geolocation.watchPosition(pos => {

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;
const accuracy = pos.coords.accuracy;

/* user marker */
if(!userMarker){
userMarker = L.marker([lat,lng]).addTo(map);
}

userMarker.setLatLng([lat,lng]);

/* accuracy circle */
if(accuracyCircle) map.removeLayer(accuracyCircle);

accuracyCircle = L.circle([lat,lng],{
radius:accuracy,
color:"#2563eb",
fillOpacity:0.1
}).addTo(map);

/* geofence check */
geofences.forEach(g => {

const d = distanceMeters(lat,lng,g.lat,g.lng);
const inside = d < g.radius;

if(inside && !enterTimes[g.id]){
enterTimes[g.id] = Date.now();
addFeed(`Entered ${g.name}`);
}

if(!inside && enterTimes[g.id]){
const mins = ((Date.now()-enterTimes[g.id])/60000).toFixed(1);
addFeed(`Left ${g.name} (${mins} min)`);
enterTimes[g.id] = null;
}

});

map.setView([lat,lng],15);

}, err => {
alert("Location error or permission denied");
});

}

/* =====================
   GEOFENCE CREATION
===================== */

map.on("click",(e)=>{

const mode = prompt("Type: geofence or cancel");

if(mode === "geofence"){

const name = prompt("Geofence name");
if(!name) return;

const radius = parseInt(prompt("Radius (m)",200));
if(!radius) return;

geofences.push({
id:Date.now(),
name,
lat:e.latlng.lat,
lng:e.latlng.lng,
radius
});

save();

alert("Geofence created");
}

});

/* =====================
   INIT
===================== */

renderFeed();

</script>

</body>
</html>
