<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Location SaaS MVP</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    height: 100%;
    font-family: Inter, Arial, sans-serif;
    background: #0b1220;
    color: white;
}

/* TOP BAR */
#topbar {
    background: #0f172a;
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid #1f2937;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}

/* LAYOUT */
#container {
    display: flex;
    height: calc(100vh - 50px);
}

/* SIDEBAR */
#sidebar {
    width: 340px;
    background: #0f172a;
    border-right: 1px solid #1f2937;
    padding: 12px;
    overflow-y: auto;
}

/* MAP */
#map {
    flex: 1;
}

/* CARDS */
.card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
}

.title {
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 6px;
}

.event-enter { color: #22c55e; font-weight: bold; }
.event-exit { color: #ef4444; font-weight: bold; }

.small-btn {
    font-size: 12px;
    padding: 4px 8px;
    margin-top: 6px;
    background: #ef4444;
}
</style>
</head>

<body>

<div id="topbar">
    <button id="trackBtn">Start Tracking</button>
    <button id="businessMode">Business Mode: OFF</button>
</div>

<div id="container">
    <div id="sidebar"></div>
    <div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   MAP
========================= */

const map = L.map('map').setView([55.9533, -3.1883], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

/* =========================
   DATA
========================= */

let places = JSON.parse(localStorage.getItem("places") || "[]");
let geofences = JSON.parse(localStorage.getItem("geofences") || "[]");
let feed = JSON.parse(localStorage.getItem("feed") || "[]");
let insideState = JSON.parse(localStorage.getItem("insideState") || "{}");

/* =========================
   STATE
========================= */

let userMarker = null;
let accuracyCircle = null;
let geofenceLayers = [];
let businessMode = false;

/* =========================
   SAVE
========================= */

function save() {
    localStorage.setItem("places", JSON.stringify(places));
    localStorage.setItem("geofences", JSON.stringify(geofences));
    localStorage.setItem("feed", JSON.stringify(feed));
    localStorage.setItem("insideState", JSON.stringify(insideState));
}

/* =========================
   EVENT SYSTEM
========================= */

function addEvent(type, g) {

    const text =
        businessMode
            ? (type === "ENTER" ? "CHECK-IN: " : "CHECK-OUT: ") + g.name
            : (type === "ENTER" ? "Entered " : "Left ") + g.name;

    feed.unshift({
        time: new Date().toLocaleTimeString(),
        type,
        text,
        geofenceId: g.id
    });

    insideState[g.id] = (type === "ENTER");

    save();
    renderPanel();
}

/* =========================
   DISTANCE
========================= */

function distance(lat1, lon1, lat2, lon2) {
    const R = 6371000;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat/2) ** 2 +
        Math.cos(lat1 * Math.PI/180) *
        Math.cos(lat2 * Math.PI/180) *
        Math.sin(dLng/2) ** 2;

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* =========================
   DRAW GEOFENCES
========================= */

function drawGeofences() {

    geofenceLayers.forEach(l => map.removeLayer(l));
    geofenceLayers = [];

    geofences.forEach(g => {

        const circle = L.circle([g.lat, g.lng], {
            radius: g.radius,
            color: "orange",
            fillOpacity: 0.2
        }).addTo(map);

        // attach id for deletion
        circle._geoId = g.id;

        geofenceLayers.push(circle);
    });
}

/* =========================
   DELETE GEOFENCE
========================= */

function deleteGeofence(id) {

    geofences = geofences.filter(g => g.id !== id);

    // reset state so no ghost tracking
    delete insideState[id];

    save();
    drawGeofences();
    renderPanel();
}

/* =========================
   PANEL
========================= */

function renderPanel() {

    const el = document.getElementById("sidebar");

    const enterCount = feed.filter(f => f.type === "ENTER").length;
    const exitCount = feed.filter(f => f.type === "EXIT").length;

    el.innerHTML = `

    <div class="card">
        <div class="title">LIVE STATS</div>
        <div>🟢 Entries: ${enterCount}</div>
        <div>🔴 Exits: ${exitCount}</div>
        <div>📍 Geofences: ${geofences.length}</div>
    </div>

    <div class="card">
        <div class="title">GEOFENCES</div>

        ${geofences.length === 0 ? "None" :
        geofences.map(g => `
            <div style="margin-bottom:8px;">
                📍 ${g.name} (${g.radius}m)
                <br>
                <button class="small-btn" onclick="deleteGeofence(${g.id})">
                    Delete
                </button>
            </div>
        `).join("")}
    </div>

    <div class="card">
        <div class="title">EVENT FEED</div>

        ${feed.length === 0 ? "No activity yet" :
        feed.map(f => `
            <div style="margin-bottom:10px;">
                <div class="${f.type === "ENTER" ? "event-enter" : "event-exit"}">
                    ${f.type}
                </div>
                <div style="font-size:12px;opacity:0.7">${f.time}</div>
                <div>${f.text}</div>
            </div>
        `).join("")}
    </div>

    `;
}

/* =========================
   TRACKING
========================= */

document.getElementById("trackBtn").onclick = () => {

    if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
    }

    navigator.geolocation.watchPosition(pos => {

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const acc = pos.coords.accuracy;

        if (!userMarker) {
            userMarker = L.marker([lat, lng]).addTo(map);
        }

        userMarker.setLatLng([lat, lng]);

        if (accuracyCircle) map.removeLayer(accuracyCircle);

        accuracyCircle = L.circle([lat, lng], {
            radius: acc,
            color: "#3b82f6",
            fillOpacity: 0.1
        }).addTo(map);

        geofences.forEach(g => {

            const d = distance(lat, lng, g.lat, g.lng);
            const inside = d < g.radius;

            if (inside && !insideState[g.id]) {
                addEvent("ENTER", g);
            }

            if (!inside && insideState[g.id]) {
                addEvent("EXIT", g);
            }
        });

        map.setView([lat, lng], 15);

    }, err => {
        alert("Location permission blocked");
    });
};

/* =========================
   BUSINESS MODE
========================= */

document.getElementById("businessMode").onclick = () => {
    businessMode = !businessMode;
    document.getElementById("businessMode").innerText =
        "Business Mode: " + (businessMode ? "ON" : "OFF");
};

/* =========================
   ADD GEOFENCE (CLICK MAP)
========================= */

map.on("click", e => {

    const name = prompt("Geofence name");
    if (!name) return;

    const radius = parseInt(prompt("Radius (meters)", 200));

    geofences.push({
        id: Date.now(),
        name,
        lat: e.latlng.lat,
        lng: e.latlng.lng,
        radius
    });

    save();
    drawGeofences();
    renderPanel();
});

/* =========================
   INIT
========================= */

drawGeofences();
renderPanel();

</script>

</body>
</html>
