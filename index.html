<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Route Navigation Engine</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
height: 100%;
margin: 0;
font-family: Arial;
background: #0f172a;
color: white;
}

#topbar {
background: #111827;
padding: 10px;
display: flex;
gap: 10px;
align-items: center;
}

button {
padding: 10px;
border: none;
border-radius: 8px;
background: #2563eb;
color: white;
cursor: pointer;
}

#map {
height: calc(100vh - 50px);
width: 100%;
}

#info {
margin-left: 10px;
}
</style>
</head>

<body>

<div id="topbar">
<span>Click 2 places to route</span>
<span id="info">Ready</span>
</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([55.9533, -3.1883], 13);

// OpenStreetMap tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution: '© OpenStreetMap'
}).addTo(map);

let clickPoints = [];
let routeLayer = null;
let markers = [];

// =========================
// CLICK MAP TO SELECT ROUTE
// =========================
map.on("click", async function(e) {

const marker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(map);
markers.push(marker);

clickPoints.push([e.latlng.lng, e.latlng.lat]); // OSRM uses lng,lat order

if (clickPoints.length === 2) {
await getRoute(clickPoints[0], clickPoints[1]);
clickPoints = [];
}
});

// =========================
// OSRM ROUTING (REAL ROADS)
// =========================
async function getRoute(start, end) {

const url =
`https://router.project-osrm.org/route/v1/driving/` +
`${start[0]},${start[1]};${end[0]},${end[1]}` +
`?overview=full&geometries=geojson`;

try {

const res = await fetch(url);
const data = await res.json();

if (!data.routes || !data.routes.length) {
document.getElementById("info").innerText = "No route found";
return;
}

const route = data.routes[0];

// remove old route
if (routeLayer) map.removeLayer(routeLayer);

// draw BLUE route
routeLayer = L.geoJSON(route.geometry, {
style: {
color: "blue",
weight: 5
}
}).addTo(map);

// fit map
map.fitBounds(routeLayer.getBounds());

// show info
const distance = route.distance / 1000;
const duration = route.duration / 60;

document.getElementById("info").innerText =
`Distance: ${distance.toFixed(2)} km | Time: ${duration.toFixed(1)} min`;

} catch (err) {
document.getElementById("info").innerText = "Routing error";
console.error(err);
}
}

</script>

</body>
</html>
