<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Geo SaaS Step 2 Safe</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial;
background:#0f172a;
color:white;
}

#wrap{
display:flex;
height:100vh;
}

#sidebar{
width:340px;
background:#111827;
padding:10px;
overflow:auto;
}

#map{
flex:1;
}

.card{
background:#1f2937;
padding:10px;
margin-bottom:10px;
border-radius:8px;
}

button{
padding:8px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
margin:3px 0;
}

.small{
font-size:12px;
opacity:0.8;
}
</style>
</head>

<body>

<div id="wrap">
<div id="sidebar">Loading...</div>
<div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

/* =========================
MAP (UNCHANGED)
========================= */

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

/* =========================
STATE (UNCHANGED CORE)
========================= */

let places = [];
let geofences = [];
let feed = [];
let inside = {};

let entries = 0;
let exits = 0;

/* =========================
SUPABASE (SAFE)
========================= */

let supabase = null;
let backendOK = false;

async function initSupabase(){

try{
const { createClient } = await import(
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
);

supabase = createClient(
"https://ihvutyeambhbynjsjnbw.supabase.co",
"sb_publishable_2V_TIKwFpZWLvS1V_vUl_g_HW3WL6pJ"
);

const test = await supabase.from("places").select("*").limit(1);
backendOK = !test.error;

}catch{
backendOK = false;
}

}

/* =========================
LOAD (SAFE)
========================= */

async function load(){

if(backendOK){

const p = await supabase.from("places").select("*");
const g = await supabase.from("geofences").select("*");
const f = await supabase.from("feed").select("*");

places = p.data || places;
geofences = g.data || geofences;
feed = f.data || feed;

}

render();
draw();

}

/* =========================
FEED (IMPROVED STRUCTURE)
========================= */

async function addFeed(type,text){

feed.unshift({
type,
text,
time:new Date().toLocaleTimeString()
});

if(feed.length>80) feed.pop();

if(backendOK){
await supabase.from("feed").insert([{type,text}]);
}

render();

}

/* =========================
DISTANCE (UNCHANGED)
========================= */

function distance(a,b,c,d){
const R=6371000;

const dLat=(c-a)*Math.PI/180;
const dLng=(d-b)*Math.PI/180;

const x=
Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*
Math.cos(c*Math.PI/180)*
Math.sin(dLng/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/* =========================
DRAW (UNCHANGED)
========================= */

let markers=[];
let circles=[];

function draw(){

markers.forEach(m=>map.removeLayer(m));
circles.forEach(c=>map.removeLayer(c));

markers=[];
circles=[];

for(const p of places){
if(!p.lat) continue;

markers.push(
L.marker([p.lat,p.lng])
.addTo(map)
.bindPopup(p.name || "Place")
);
}

for(const g of geofences){
if(!g.lat) continue;

circles.push(
L.circle([g.lat,g.lng],{
radius:g.radius||200,
color:"#3b82f6",
fillColor:"#3b82f6",
fillOpacity:0.2
}).addTo(map)
);
}

}

/* =========================
TRACKING (UNCHANGED CORE LOGIC)
========================= */

let userMarker=null;
let accuracyCircle=null;

function startTracking(){

if(!navigator.geolocation){
alert("No GPS");
return;
}

navigator.geolocation.watchPosition(async pos=>{

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;
const acc=pos.coords.accuracy;

if(!userMarker){
userMarker=L.marker([lat,lng]).addTo(map);
}

userMarker.setLatLng([lat,lng]);

if(accuracyCircle) map.removeLayer(accuracyCircle);

accuracyCircle=L.circle([lat,lng],{
radius:acc,
color:"#3b82f6",
fillOpacity:0.1
}).addTo(map);

for(const g of geofences){

const d=distance(lat,lng,g.lat,g.lng);
const insideNow=d<g.radius;

if(insideNow && !inside[g.id]){
inside[g.id]=true;
entries++;
await addFeed("ENTER",g.name);
}

if(!insideNow && inside[g.id]){
inside[g.id]=false;
exits++;
await addFeed("EXIT",g.name);
}

}

map.setView([lat,lng],15);

});

}

/* =========================
MAP CLICK (IMPROVED UX ONLY)
========================= */

map.on("click",async e=>{

const choice = confirm("OK = Place | Cancel = Geofence");

if(choice){

places.push({
id:Date.now(),
name:"Place",
lat:e.latlng.lat,
lng:e.latlng.lng
});

await addFeed("PLACE","Added place");

}else{

geofences.push({
id:Date.now(),
name:"Geofence",
lat:e.latlng.lat,
lng:e.latlng.lng,
radius:200
});

await addFeed("GEOFENCE","Added geofence");

}

draw();
render();

});

/* =========================
RENDER (CLEANER UI ONLY)
========================= */

function render(){

document.getElementById("sidebar").innerHTML=`
<div class="card">
<button id="trackBtn">Start Tracking</button>
</div>

<div class="card">
<b>Stats</b><br>
Places: ${places.length}<br>
Geofences: ${geofences.length}<br>
Entries: ${entries}<br>
Exits: ${exits}
</div>

<div class="card">
<b>Feed</b><br>
${feed.length ? feed.map(f=>`
<div style="margin-bottom:6px">
<b>${f.type}</b><br>
${f.text}<br>
<span class="small">${f.time || ""}</span>
</div>
`).join("") : "No activity yet"}
</div>
`;

document.getElementById("trackBtn").onclick=startTracking;

}

/* =========================
BOOT (UNCHANGED SAFE)
========================= */

await initSupabase();
await load();
render();
draw();

</script>

</body>
</html>
