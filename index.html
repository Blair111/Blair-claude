<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Map Clean v1</title>

<link rel="icon" href="data:,">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial,sans-serif;
}

#topbar{
background:#111827;
color:white;
padding:10px;
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#map{
height:calc(100vh - 50px);
width:100%;
}

#info{
font-weight:bold;
}

#coords{
color:#93c5fd;
}

/* FEED PANEL */
#feed{
position:fixed;
right:10px;
top:70px;
width:300px;
max-height:70vh;
overflow:auto;
background:#111827;
color:white;
padding:10px;
border-radius:10px;
font-size:12px;
display:none;
z-index:9999;
}

.feed-item{
padding:6px;
border-bottom:1px solid #1f2937;
}
</style>
</head>

<body>

<div id="topbar">
<button id="trackBtn">Track Me</button>
<button id="feedBtn">Feed</button>

<span id="info">Ready</span>
<span id="coords">Lat: -- | Lng: --</span>
</div>

<div id="map"></div>
<div id="feed"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================
   SAFE INIT (NO GLOBAL HTML ONCLICK)
===================== */

document.addEventListener("DOMContentLoaded", () => {

/* MAP */
const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

/* STATE */
let geofences = JSON.parse(localStorage.getItem('geofences') || '[]');
let feed = JSON.parse(localStorage.getItem('feed') || '[]');

let userMarker = null;
let accuracyCircle = null;
let enterTimes = {};
let feedOpen = false;

/* SAVE */
function save(){
localStorage.setItem('geofences', JSON.stringify(geofences));
localStorage.setItem('feed', JSON.stringify(feed));
}

/* FEED */
function renderFeed(){
const el = document.getElementById("feed");
el.innerHTML = feed.map(i =>
`<div class="feed-item"><b>${i.time}</b><br>${i.text}</div>`
).join("");
}

function addFeed(text){
feed.unshift({
text,
time:new Date().toLocaleTimeString()
});
save();
if(feedOpen) renderFeed();
}

/* FEED BUTTON (FIXED RELIABILITY) */
document.getElementById("feedBtn").addEventListener("click", () => {

const el = document.getElementById("feed");

feedOpen = !feedOpen;

if(feedOpen){
el.style.display = "block";
renderFeed();
} else {
el.style.display = "none";
}

});

/* TRACK BUTTON */
document.getElementById("trackBtn").addEventListener("click", () => {

if(!navigator.geolocation){
alert("Geolocation not supported");
return;
}

navigator.geolocation.watchPosition(pos => {

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;
const accuracy = pos.coords.accuracy;

/* USER MARKER */
if(!userMarker){
userMarker = L.marker([lat,lng]).addTo(map);
}

userMarker.setLatLng([lat,lng]);

/* ACCURACY */
if(accuracyCircle) map.removeLayer(accuracyCircle);

accuracyCircle = L.circle([lat,lng],{
radius:accuracy,
color:"#2563eb",
fillOpacity:0.1
}).addTo(map);

/* GEOFENCE CHECK */
geofences.forEach(g => {

const R = 6371000;
const dLat = (g.lat-lat)*Math.PI/180;
const dLng = (g.lng-lng)*Math.PI/180;

const a =
Math.sin(dLat/2)**2 +
Math.cos(lat*Math.PI/180) *
Math.cos(g.lat*Math.PI/180) *
Math.sin(dLng/2)**2;

const d = R * 2 * Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

const inside = d < g.radius;

if(inside && !enterTimes[g.id]){
enterTimes[g.id] = Date.now();
addFeed("Entered " + g.name);
}

if(!inside && enterTimes[g.id]){
const mins = ((Date.now()-enterTimes[g.id])/60000).toFixed(1);
addFeed("Left " + g.name + " (" + mins + " min)");
enterTimes[g.id] = null;
}

});

map.setView([lat,lng],15);

}, err => {
alert("Location error");
});

});

/* MAP CLICK = CREATE GEOFENCE */
map.on("click", (e) => {

const name = prompt("Geofence name");
if(!name) return;

const radius = parseInt(prompt("Radius (m)",200));
if(!radius) return;

geofences.push({
id:Date.now(),
name,
lat:e.latlng.lat,
lng:e.latlng.lng,
radius
});

save();

alert("Geofence created");

});

/* INIT */
renderFeed();

}); // DOM READY END

</script>

</body>
</html>
