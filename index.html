<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Location Tracker Map</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
height: 100%;
margin: 0;
padding: 0;
font-family: Arial;
background: #0f172a;
color: white;
}

#topbar {
background: #111827;
padding: 10px;
display: flex;
gap: 10px;
align-items: center;
}

button {
padding: 10px;
border: none;
border-radius: 8px;
background: #2563eb;
color: white;
cursor: pointer;
}

#map {
height: calc(100vh - 50px);
width: 100%;
}

#info {
margin-left: 10px;
}
</style>
</head>

<body>

<div id="topbar">
<button onclick="startTracking()">Track My Location</button>
<span id="info">Ready</span>
</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([55.9533, -3.1883], 13);

// Base map
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution: '© OpenStreetMap'
}).addTo(map);

// Data
let savedPlaces = JSON.parse(localStorage.getItem("savedPlaces") || "[]");
let markers = [];
let routeLines = [];

// 🔵 Your live location marker
let userMarker = null;

// ============================
// SAVE / LOAD
// ============================
function savePlaces() {
localStorage.setItem("savedPlaces", JSON.stringify(savedPlaces));
}

// ============================
// RENDER SAVED PLACES
// ============================
function renderPlaces() {

// clear old markers
markers.forEach(m => map.removeLayer(m));
markers = [];

// clear old lines
routeLines.forEach(l => map.removeLayer(l));
routeLines = [];

savedPlaces.forEach(place => {

const marker = L.marker([place.lat, place.lng])
.addTo(map)
.bindPopup(place.name);

markers.push(marker);

});

// draw distances between ALL saved places
for (let i = 0; i < savedPlaces.length; i++) {
for (let j = i + 1; j < savedPlaces.length; j++) {
drawLine(savedPlaces[i], savedPlaces[j]);
}
}

}

// ============================
// DRAW LINE + DISTANCE LABEL
// ============================
function drawLine(a, b) {

const distance = getDistance(a.lat, a.lng, b.lat, b.lng);

const line = L.polyline(
[[a.lat, a.lng], [b.lat, b.lng]],
{
color: "#3b82f6",
weight: 3,
dashArray: "6,6"
}
).addTo(map);

line.bindTooltip(
`${a.name} ↔ ${b.name}<br>${(distance / 1000).toFixed(2)} km`,
{ permanent: false }
);

routeLines.push(line);
}

// ============================
// DISTANCE CALCULATION
// ============================
function getDistance(lat1, lon1, lat2, lon2) {

const R = 6371e3;

const φ1 = lat1 * Math.PI / 180;
const φ2 = lat2 * Math.PI / 180;

const Δφ = (lat2 - lat1) * Math.PI / 180;
const Δλ = (lon2 - lon1) * Math.PI / 180;

const a =
Math.sin(Δφ / 2) ** 2 +
Math.cos(φ1) *
Math.cos(φ2) *
Math.sin(Δλ / 2) ** 2;

const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

return R * c;
}

// ============================
// LIVE LOCATION TRACKING
// ============================
function startTracking() {

if (!navigator.geolocation) {
alert("Geolocation not supported");
return;
}

navigator.geolocation.watchPosition(pos => {

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

// first time: create marker
if (!userMarker) {
userMarker = L.circleMarker([lat, lng], {
radius: 10,
color: "#22c55e",
fillColor: "#22c55e",
fillOpacity: 1
}).addTo(map).bindPopup("You are here");
}

// update position
userMarker.setLatLng([lat, lng]);

map.setView([lat, lng], 15);

document.getElementById("info").innerText =
"Live tracking active";

}, err => {
alert("Location permission denied or unavailable");
});

}

// ============================
// ADD PLACE BY CLICKING MAP
// ============================
map.on("click", function (e) {

const name = prompt("Name this place");
if (!name) return;

savedPlaces.push({
name,
lat: e.latlng.lat,
lng: e.latlng.lng
});

savePlaces();
renderPlaces();

});

// init
renderPlaces();

</script>

</body>
</html>
