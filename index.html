<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geo Platform Stable</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial;
}

#wrap{
display:flex;
height:100vh;
}

#sidebar{
width:340px;
background:#111827;
color:white;
padding:10px;
overflow:auto;
}

#map{
flex:1;
}

.card{
background:#1f2937;
padding:10px;
margin-bottom:10px;
border-radius:8px;
}

button{
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:5px;
}

.track{
background:#2563eb;
color:white;
}

.archive{
background:#ef4444;
color:white;
}

.restore{
background:#22c55e;
color:white;
}

.small{
font-size:12px;
opacity:0.8;
}
</style>
</head>

<body>

<div id="wrap">
<div id="sidebar"></div>
<div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ================= MAP ================= */

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

/* ================= STORAGE ================= */

let places = JSON.parse(localStorage.getItem("places") || "[]");
let geofences = JSON.parse(localStorage.getItem("geofences") || "[]");
let archived = JSON.parse(localStorage.getItem("archived") || "[]");
let feed = JSON.parse(localStorage.getItem("feed") || "[]");
let inside = JSON.parse(localStorage.getItem("inside") || "{}");

/* ================= STATE ================= */

let userMarker = null;
let accuracyCircle = null;
let tracking = false;

/* ================= SAVE ================= */

function save(){
localStorage.setItem("places", JSON.stringify(places));
localStorage.setItem("geofences", JSON.stringify(geofences));
localStorage.setItem("archived", JSON.stringify(archived));
localStorage.setItem("feed", JSON.stringify(feed));
localStorage.setItem("inside", JSON.stringify(inside));
}

/* ================= DISTANCE ================= */

function distance(a,b,c,d){
const R=6371000;

const dLat=(c-a)*Math.PI/180;
const dLng=(d-b)*Math.PI/180;

const x =
Math.sin(dLat/2)**2 +
Math.cos(a*Math.PI/180)*
Math.cos(c*Math.PI/180)*
Math.sin(dLng/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/* ================= FEED ================= */

function addFeed(text){
feed.unshift({
time:new Date().toLocaleTimeString(),
text
});

if(feed.length>50) feed.pop();

save();
render();
}

/* ================= TRACKING ================= */

function startTracking(){

if(tracking) return;
tracking = true;

navigator.geolocation.watchPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;
const acc = pos.coords.accuracy;

if(!userMarker){
userMarker = L.marker([lat,lng]).addTo(map);
}

userMarker.setLatLng([lat,lng]);

if(accuracyCircle){
map.removeLayer(accuracyCircle);
}

accuracyCircle = L.circle([lat,lng],{
radius:acc,
color:"#3b82f6",
fillOpacity:0.1
}).addTo(map);

/* GEO ENGINE */
for(let g of geofences){

const d = distance(lat,lng,g.lat,g.lng);
const isInside = d < g.radius;

/* ENTER */
if(isInside && !inside[g.id]){
inside[g.id] = true;
addFeed("Entered " + g.name);
}

/* EXIT */
if(!isInside && inside[g.id]){
inside[g.id] = false;
addFeed("Left " + g.name);
}

}

map.setView([lat,lng],15);

save();

},err=>{
alert("Location denied");
});

}

/* ================= MAP CLICK ================= */

map.on("click",e=>{

const type = prompt("type: place / geofence / archive");

if(type==="geofence"){

const name = prompt("name");
const radius = parseInt(prompt("radius","200"));

geofences.push({
id:Date.now(),
name,
lat:e.latlng.lat,
lng:e.latlng.lng,
radius
});

save();
render();
return;
}

if(type==="archive"){

if(geofences.length===0){
alert("no geofences");
return;
}

const g = geofences.pop();
archived.push(g);

save();
render();
return;
}

/* PLACE */

places.push({
id:Date.now(),
name:prompt("name"),
lat:e.latlng.lat,
lng:e.latlng.lng
});

save();
render();

});

/* ================= RENDER ================= */

function render(){

const s = document.getElementById("sidebar");

let html = "";

/* TRACK */
html += `
<div class="card">
<button class="track" onclick="startTracking()">Start Tracking</button>
</div>`;

/* FEED */
html += `<div class="card"><b>FEED</b>`;

for(let f of feed){
html += `<div class="small">${f.time}</div><div>${f.text}</div><hr>`;
}

html += `</div>`;

/* GEOFENCES */
html += `<div class="card"><b>Geofences</b>`;

for(let g of geofences){
html += `<div>${g.name} (${g.radius}m)</div>`;
}

html += `</div>`;

/* ARCHIVE */
html += `<div class="card"><b>Archived</b>`;

for(let a of archived){
html += `<div>${a.name}</div>`;
}

html += `</div>`;

s.innerHTML = html;

}

/* ================= INIT ================= */

render();

</script>

</body>
</html>
