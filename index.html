<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Location Workflow Platform</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial,sans-serif;
}

#topbar{
background:#111827;
color:white;
padding:10px;
display:flex;
gap:12px;
align-items:center;
flex-wrap:wrap;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#map{
height:calc(100vh - 50px);
width:100%;
}

#info{
font-weight:bold;
}

#coords{
color:#93c5fd;
}

#feed{
position:absolute;
right:10px;
top:70px;
width:260px;
max-height:60vh;
overflow:auto;
background:#111827;
color:white;
padding:10px;
border-radius:10px;
font-size:12px;
opacity:0.95;
}

.feed-item{
border-bottom:1px solid #1f2937;
padding:6px 0;
}
</style>
</head>

<body>

<div id="topbar">
<button onclick="trackMe()">Track Me</button>
<button onclick="showFeed()">Toggle Feed</button>
<span id="info">Ready</span>
<span id="coords">Lat: -- | Lng: --</span>
</div>

<div id="map"></div>

<div id="feed" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

// =====================
// DATA
// =====================

let places = JSON.parse(localStorage.getItem('places') || '[]');
let geofences = JSON.parse(localStorage.getItem('geofences') || '[]');
let experiences = JSON.parse(localStorage.getItem('experiences') || '[]');
let visits = JSON.parse(localStorage.getItem('visits') || '[]');

let markers = [];
let geofenceCircles = [];

let selected = [];
let routeLayer = null;

let userMarker = null;
let accuracyCircle = null;

let activeGeofence = null;
let geofenceEnterTime = {};

// =====================
// SAVE
// =====================

function saveAll(){
localStorage.setItem('places', JSON.stringify(places));
localStorage.setItem('geofences', JSON.stringify(geofences));
localStorage.setItem('experiences', JSON.stringify(experiences));
localStorage.setItem('visits', JSON.stringify(visits));
}

// =====================
// FEED
// =====================

function logEvent(text){

const time = new Date().toLocaleTimeString();

visits.unshift({text,time});
saveAll();

const feed = document.getElementById("feed");

const div = document.createElement("div");
div.className = "feed-item";
div.innerText = `${time} - ${text}`;

feed.prepend(div);
}

// =====================
// DISTANCE
// =====================

function distanceMeters(lat1,lng1,lat2,lng2){

const R = 6371000;
const dLat = (lat2-lat1)*Math.PI/180;
const dLng = (lng2-lng1)*Math.PI/180;

const a =
Math.sin(dLat/2)**2 +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLng/2)**2;

return R * 2 * Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// =====================
// EXPERIENCES
// =====================

function getExperience(geofenceId){
return experiences.find(e => e.geofenceId === geofenceId);
}

// =====================
// RENDER GEOFENCES
// =====================

function renderGeofences(){

geofenceCircles.forEach(c => map.removeLayer(c));
geofenceCircles = [];

geofences.forEach(g => {

const circle = L.circle([g.lat,g.lng],{
radius:g.radius,
color:"orange",
fillOpacity:0.15
}).addTo(map);

circle.bindPopup(`
<b>${g.name}</b><br>
Click to add experience
`);

circle.on("click", () => {

const text = prompt("Add experience message for this location:");

if(!text) return;

experiences.push({
geofenceId:g.id,
text
});

saveAll();

alert("Experience saved");
});

geofenceCircles.push(circle);
});
}

// =====================
// CREATE GEOFENCE
// =====================

function createGeofence(lat,lng){

const name = prompt("Geofence name");
if(!name) return;

const radius = parseInt(prompt("Radius (m)",200));
if(!radius) return;

const id = Date.now().toString();

geofences.push({id,name,lat,lng,radius});
saveAll();
renderGeofences();

}

// =====================
// TRACKING
// =====================

function trackMe(){

navigator.geolocation.watchPosition(pos => {

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;
const accuracy = pos.coords.accuracy;

// user marker
if(!userMarker){

userMarker = L.marker([lat,lng],{
icon:L.divIcon({
html:`<div style="width:18px;height:18px;background:#2563eb;border-radius:50%;border:3px solid white;"></div>`,
className:""
})
}).addTo(map);

}

userMarker.setLatLng([lat,lng]);

if(accuracyCircle) map.removeLayer(accuracyCircle);

accuracyCircle = L.circle([lat,lng],{
radius:accuracy,
color:"#2563eb",
fillOpacity:0.1
}).addTo(map);

// geofence logic
geofences.forEach(g => {

const d = distanceMeters(lat,lng,g.lat,g.lng);
const inside = d < g.radius;

if(inside && !geofenceEnterTime[g.id]){

geofenceEnterTime[g.id] = Date.now();

logEvent(`Entered ${g.name}`);

// show experience
const exp = getExperience(g.id);
if(exp){
alert(`Experience:\n\n${exp.text}`);
}

}

if(!inside && geofenceEnterTime[g.id]){

const duration = Date.now() - geofenceEnterTime[g.id];

logEvent(`Left ${g.name} (Stayed ${(duration/1000/60).toFixed(1)} min)`);

geofenceEnterTime[g.id] = null;
}

});

map.setView([lat,lng],15);

}, err => {
document.getElementById("info").innerText = "Location error";
});
}

// =====================
// MAP CLICK
// =====================

map.on("click", async (e) => {

const mode = prompt("Type: place or geofence");

if(mode === "geofence"){
createGeofence(e.latlng.lat,e.latlng.lng);
return;
}

const name = prompt("Place name");
if(!name) return;

places.push({
id:Date.now().toString(),
name,
lat:e.latlng.lat,
lng:e.latlng.lng
});

saveAll();
renderPlaces();
});

// =====================
// FEED TOGGLE
// =====================

function showFeed(){
const feed = document.getElementById("feed");
feed.style.display = feed.style.display === "none" ? "block" : "none";
}

// =====================
// STARTUP
// =====================

function renderPlaces(){

markers.forEach(m => map.removeLayer(m));
markers = [];

places.forEach(p => {

const m = L.marker([p.lat,p.lng]).addTo(map);
m.bindPopup(p.name);

markers.push(m);
});
}

renderPlaces();
renderGeofences();

</script>

</body>
</html>
