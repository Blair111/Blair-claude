<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Advanced Map</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html, body {
height: 100%;
margin: 0;
font-family: Arial, sans-serif;
background: #0f172a;
color: white;
}

#topbar {
background: #111827;
padding: 10px;
display: flex;
gap: 15px;
align-items: center;
flex-wrap: wrap;
}

button {
padding: 10px;
border: none;
border-radius: 8px;
background: #2563eb;
color: white;
cursor: pointer;
}

button:hover {
background: #1d4ed8;
}

#info {
font-weight: bold;
}

#coords {
color: #93c5fd;
}

#map {
height: calc(100vh - 60px);
width: 100%;
}

</style>
</head>

<body>

<div id="topbar">

<button onclick="startTracking()">Track Me</button>

<span id="info">Ready</span>

<span id="coords">
Lat: -- | Lng: --
</span>

</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ======================
// MAP
// ======================

const map = L.map('map').setView([55.9533, -3.1883], 13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution: '© OpenStreetMap'
}
).addTo(map);

// ======================
// STORAGE
// ======================

let savedPlaces =
JSON.parse(
localStorage.getItem("savedPlaces") || "[]"
);

let markers = [];

let routeLayer = null;

let selectedPlaces = [];

let userMarker = null;

// ======================
// SAVE
// ======================

function savePlaces() {

localStorage.setItem(
"savedPlaces",
JSON.stringify(savedPlaces)
);

}

// ======================
// REVERSE GEOCODE
// ======================

async function getAddress(lat, lng) {

try {

const response = await fetch(
`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`
);

const data = await response.json();

return data.display_name || "Address unavailable";

}
catch {

return "Address unavailable";

}

}

// ======================
// RENDER MARKERS
// ======================

function renderPlaces() {

markers.forEach(m => map.removeLayer(m));

markers = [];

savedPlaces.forEach(place => {

const marker =
L.marker([place.lat, place.lng])
.addTo(map)
.bindPopup(`
<b>${place.name}</b>
<br><br>

<b>Latitude:</b><br>
${place.lat.toFixed(6)}

<br><br>

<b>Longitude:</b><br>
${place.lng.toFixed(6)}

<br><br>

<b>Address:</b><br>
${place.address || "Unknown"}
`);

marker.on("click", () => {

selectedPlaces.push(place);

if (selectedPlaces.length === 2) {

getRoute(
selectedPlaces[0],
selectedPlaces[1]
);

selectedPlaces = [];

}

});

markers.push(marker);

});

}

// ======================
// LIVE MOUSE COORDINATES
// ======================

map.on("mousemove", function(e) {

document.getElementById("coords").innerText =
`Lat: ${e.latlng.lat.toFixed(6)} | Lng: ${e.latlng.lng.toFixed(6)}`;

});

// ======================
// LIVE LOCATION TRACKING
// ======================

function startTracking() {

if (!navigator.geolocation) {

alert("Geolocation not supported");

return;

}

navigator.geolocation.watchPosition(

(position) => {

const lat = position.coords.latitude;
const lng = position.coords.longitude;

if (!userMarker) {

userMarker =
L.circleMarker(
[lat, lng],
{
radius: 10,
color: "#22c55e",
fillColor: "#22c55e",
fillOpacity: 1
}
)
.addTo(map)
.bindPopup("You are here");

}

userMarker.setLatLng([lat, lng]);

map.setView([lat, lng], 15);

document.getElementById("info").innerText =
"Tracking active";

},

(error) => {

document.getElementById("info").innerText =
"Location unavailable";

}

);

}

// ======================
// ADD NEW SAVED PLACE
// ======================

map.on("click", async function(e) {

const name =
prompt("Name this place");

if (!name) return;

document.getElementById("info").innerText =
"Looking up address...";

const address =
await getAddress(
e.latlng.lat,
e.latlng.lng
);

savedPlaces.push({

name: name,

lat: e.latlng.lat,

lng: e.latlng.lng,

address: address

});

savePlaces();

renderPlaces();

document.getElementById("info").innerText =
"Place saved";

});

// ======================
// REAL ROAD ROUTING
// ======================

async function getRoute(a, b) {

try {

const url =
`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;

const response =
await fetch(url);

const data =
await response.json();

if (
!data.routes ||
!data.routes.length
) {

document.getElementById("info").innerText =
"No route found";

return;

}

const route =
data.routes[0];

if (routeLayer) {

map.removeLayer(routeLayer);

}

routeLayer =
L.geoJSON(
route.geometry,
{
style: {
color: "blue",
weight: 5
}
}
).addTo(map);

map.fitBounds(
routeLayer.getBounds()
);

const km =
(route.distance / 1000).toFixed(2);

const mins =
(route.duration / 60).toFixed(1);

document.getElementById("info").innerText =
`${a.name} → ${b.name} | ${km} km | ${mins} mins`;

}
catch (err) {

document.getElementById("info").innerText =
"Routing error";

console.error(err);

}

}

// ======================
// INITIAL LOAD
// ======================

renderPlaces();

</script>

</body>
</html>
