<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Map</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
height: 100%;
margin: 0;
padding: 0;
font-family: Arial;
background: #0f172a;
color: white;
}

#topbar {
background: #111827;
padding: 10px;
display: flex;
gap: 10px;
align-items: center;
}

button {
padding: 10px;
border: none;
border-radius: 8px;
background: #2563eb;
color: white;
cursor: pointer;
}

#map {
height: calc(100vh - 50px);
width: 100%;
}

#error {
padding: 10px;
color: red;
display: none;
}
</style>
</head>

<body>

<div id="topbar">
<button onclick="getLocation()">Find Me</button>
<span id="info">Loading map...</span>
</div>

<div id="error"></div>
<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map;
let savedPlaces = JSON.parse(localStorage.getItem("savedPlaces") || "[]");
let markers = [];
let selectedPlaces = [];
let routeLine = null;

function showError(msg) {
const err = document.getElementById("error");
err.style.display = "block";
err.innerText = msg;
}

function initMap() {
if (typeof L === "undefined") {
showError("Leaflet failed to load (CDN blocked or offline).");
return;
}

map = L.map('map').setView([55.9533, -3.1883], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution: '© OpenStreetMap'
}).addTo(map);

document.getElementById("info").innerText = "Map ready";

map.on("click", function (e) {
const name = prompt("Name this place");
if (!name) return;

savedPlaces.push({
name,
lat: e.latlng.lat,
lng: e.latlng.lng
});

localStorage.setItem("savedPlaces", JSON.stringify(savedPlaces));
renderPlaces();
});

renderPlaces();
}

function renderPlaces() {
if (!map) return;

markers.forEach(m => map.removeLayer(m));
markers = [];

savedPlaces.forEach(place => {
const marker = L.marker([place.lat, place.lng])
.addTo(map)
.bindPopup(place.name);

marker.on("click", () => {
selectedPlaces.push(place);

if (selectedPlaces.length === 2) {
drawRoute(selectedPlaces[0], selectedPlaces[1]);
selectedPlaces = [];
}
});

markers.push(marker);
});
}

function drawRoute(a, b) {
if (routeLine) map.removeLayer(routeLine);

routeLine = L.polyline(
[[a.lat, a.lng], [b.lat, b.lng]],
{ color: "blue", weight: 5 }
).addTo(map);

const distance = getDistance(a.lat, a.lng, b.lat, b.lng);

document.getElementById("info").innerText =
`${a.name} → ${b.name} | ${(distance / 1000).toFixed(2)} km`;

map.fitBounds(routeLine.getBounds());
}

function getDistance(lat1, lon1, lat2, lon2) {
const R = 6371e3;

const φ1 = lat1 * Math.PI / 180;
const φ2 = lat2 * Math.PI / 180;

const Δφ = (lat2 - lat1) * Math.PI / 180;
const Δλ = (lon2 - lon1) * Math.PI / 180;

const a =
Math.sin(Δφ / 2) ** 2 +
Math.cos(φ1) * Math.cos(φ2) *
Math.sin(Δλ / 2) ** 2;

return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getLocation() {
if (!map) return;

navigator.geolocation.getCurrentPosition(pos => {
const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

map.setView([lat, lng], 15);

L.marker([lat, lng])
.addTo(map)
.bindPopup("You are here")
.openPopup();

document.getElementById("info").innerText = "Location found";
});
}

window.onload = initMap;
</script>

</body>
</html>
