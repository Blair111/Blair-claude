<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Geo Platform ULTRA STABLE</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
font-family:Arial;
}

#wrap{
display:flex;
height:100vh;
}

#sidebar{
width:340px;
background:#111827;
color:white;
padding:10px;
overflow:auto;
}

#map{
flex:1;
}

.card{
background:#1f2937;
padding:10px;
margin-bottom:10px;
border-radius:8px;
}

button{
padding:8px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div id="wrap">
<div id="sidebar"></div>
<div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
STATE (ALWAYS SAFE)
========================= */

let places = [];
let geofences = [];
let feed = [];
let inside = {};

let backend = null;

/* =========================
MAP (ALWAYS LOAD FIRST)
========================= */

const map = L.map('map').setView([55.9533,-3.1883],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

/* =========================
SAFE SUPABASE INIT
========================= */

try {
backend = window.supabase.createClient(
"YOUR_SUPABASE_URL",
"YOUR_SUPABASE_ANON_KEY"
);
} catch (e) {
console.log("Supabase OFFLINE:", e);
backend = null;
}

/* =========================
RENDER (NEVER FAILS)
========================= */

function render(){

const s = document.getElementById("sidebar");

s.innerHTML = `
<div class="card">
<button onclick="startTracking()">Start Tracking</button>
</div>

<div class="card">
<b>Status</b><br>
Backend: ${backend ? "Connected" : "Offline"}<br>
Places: ${places.length}<br>
Geofences: ${geofences.length}
</div>

<div class="card">
<b>Feed</b><br>
${feed.length ? feed.map(f=>`<div>${f.text}</div>`).join("") : "No activity yet"}
</div>
`;

}

/* =========================
DRAW MAP (SAFE)
========================= */

let markers=[];
let circles=[];

function draw(){

markers.forEach(m=>map.removeLayer(m));
circles.forEach(c=>map.removeLayer(c));

markers=[];
circles=[];

for(const p of places){
if(!p.lat) continue;
markers.push(L.marker([p.lat,p.lng]).addTo(map).bindPopup(p.name));
}

for(const g of geofences){
if(!g.lat) continue;
circles.push(
L.circle([g.lat,g.lng],{
radius:g.radius||200,
color:"orange",
fillOpacity:0.2
}).addTo(map)
);
}

}

/* =========================
SAFE FEED
========================= */

async function addFeed(text){

feed.unshift({text});

if(feed.length>50) feed.pop();

/* try backend but NEVER block */
try {
if(backend){
await backend.from("feed").insert([{text}]);
}
} catch(e){
console.log("feed error",e);
}

render();
}

/* =========================
DISTANCE
========================= */

function distance(a,b,c,d){
const R=6371000;
const dLat=(c-a)*Math.PI/180;
const dLng=(d-b)*Math.PI/180;

const x =
Math.sin(dLat/2)**2 +
Math.cos(a*Math.PI/180)*
Math.cos(c*Math.PI/180)*
Math.sin(dLng/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/* =========================
TRACKING (SAFE)
========================= */

let userMarker=null;
let accCircle=null;
let tracking=false;

function startTracking(){

if(tracking) return;
tracking=true;

if(!navigator.geolocation){
alert("No GPS");
return;
}

navigator.geolocation.watchPosition(async pos=>{

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;
const acc=pos.coords.accuracy;

if(!userMarker){
userMarker=L.marker([lat,lng]).addTo(map);
}

userMarker.setLatLng([lat,lng]);

if(accCircle) map.removeLayer(accCircle);

accCircle=L.circle([lat,lng],{
radius:acc,
color:"#3b82f6",
fillOpacity:0.1
}).addTo(map);

/* GEO ENGINE */
for(const g of geofences){

if(!g.lat) continue;

const d = distance(lat,lng,g.lat,g.lng);
const insideNow = d < g.radius;

if(insideNow && !inside[g.id]){
inside[g.id]=true;
await addFeed("Entered "+g.name);
}

if(!insideNow && inside[g.id]){
inside[g.id]=false;
await addFeed("Left "+g.name);
}
}

map.setView([lat,lng],15);

},err=>{
alert("GPS blocked");
});

}

/* =========================
MAP CLICK
========================= */

map.on("click",async e=>{

const type=prompt("place or geofence");
if(!type) return;

if(type==="place"){

const name=prompt("name");

places.push({
id:Date.now(),
name,
lat:e.latlng.lat,
lng:e.latlng.lng
});

await addFeed("Added place "+name);

draw();
render();
return;
}

const name=prompt("geofence name");
const radius=parseInt(prompt("radius","200"));

geofences.push({
id:Date.now(),
name,
lat:e.latlng.lat,
lng:e.latlng.lng,
radius
});

await addFeed("Added geofence "+name);

draw();
render();

});

/* =========================
BOOT SEQUENCE (IMPORTANT FIX)
========================= */

/* ALWAYS RUN THESE — NEVER DEPEND ON BACKEND */
render();
draw();

/* optional backend load (non-fatal) */
(async ()=>{
try{
if(!backend) return;

const p=await backend.from("places").select("*");
const g=await backend.from("geofences").select("*");
const f=await backend.from("feed").select("*");

places=p.data||[];
geofences=g.data||[];
feed=f.data||[];

render();
draw();

}catch(e){
console.log("backend load failed but app still works",e);
}
})();

</script>

</body>
</html>
