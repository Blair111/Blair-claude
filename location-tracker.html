<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location Test</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 50px auto;
    text-align: center;
    padding: 20px;
}

button {
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
}

#result {
    margin-top: 30px;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    min-height: 100px;
}
</style>
</head>

<body>

<h1>Location Test App</h1>

<p>Click the button below to get your current location.</p>

<button onclick="getLocation()">Get My Location</button>

<div id="result">
    Waiting for location request...
</div>

<script>

function getLocation() {

    const result = document.getElementById("result");

    result.innerHTML = "Requesting location...";

    if (!navigator.geolocation) {
        result.innerHTML = "Geolocation is not supported by this browser.";
        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = Math.round(position.coords.accuracy);

            result.innerHTML = `
                <h2>Location Found</h2>
                <p><strong>Latitude:</strong> ${lat}</p>
                <p><strong>Longitude:</strong> ${lng}</p>
                <p><strong>Accuracy:</strong> ${accuracy} metres</p>

                <p>
                    <a href="https://maps.google.com/?q=${lat},${lng}"
                       target="_blank">
                       Open in Google Maps
                    </a>
                </p>
            `;
        },

        function(error) {

            result.innerHTML = `
                <h2>Location Error</h2>
                <p><strong>Error Code:</strong> ${error.code}</p>
                <p><strong>Message:</strong> ${error.message}</p>
            `;
        },

        {
            enableHighAccuracy: false,
            timeout: 60000,
            maximumAge: 300000
        }

    );
}

</script>

</body>
</html>
