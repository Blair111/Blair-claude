<!DOCTYPE html>
<html>
<body>

<button onclick="getLocation()">Get Location</button>

<p id="result"></p>

<script>
function getLocation() {
    navigator.geolocation.getCurrentPosition(
        function(position) {
            document.getElementById("result").innerHTML =
                position.coords.latitude + ", " +
                position.coords.longitude;
        },
        function(error) {
            document.getElementById("result").innerHTML =
                "Error: " + error.message;
        }
    );
}
</script>

</body>
</html>
